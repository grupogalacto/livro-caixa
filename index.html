<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Identidade: as três cores da logo da MedService (azul-royal #1835b3, violeta #a066cc, azul-céu #86c7ed) sobre fundo claro e limpo.
   Layout: menu lateral claro com a logo, filtros em painel, KPIs no topo de cada página, gráficos em grade por seções.
   Gráficos: acento azul-royal para uma medida só; Mercado Livre = azul-céu e Shopee = laranja (par validado); status em verde/âmbar/vermelho. */
:root {
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --brand: #1835b3; --brand-2: #a066cc; --brand-3: #86c7ed;
  --bg: #f2f4fb; --surface: #ffffff; --surface-2: #f6f8fd; --ink: #0d1330; --ink-2: #444c70; --muted: #6b7396;
  --line: #e1e6f3; --grid: #e8ecf6; --hover: #eef2fc;
  --accent: #1835b3; --accent-ink: #1835b3; --accent-wash: rgba(24,53,179,.08); --accent-bar: rgba(42,71,208,.22); --chart: #2a47d0; --btn-bg: #1835b3; --btn-ink: #ffffff;
  --side-bg: #ffffff; --side-ink: #4a5278; --side-line: #e6eaf5; --side-hover: #f1f4fc; --side-active: rgba(24,53,179,.09);
  --ml: #2a95d8; --sh: #eb6834; --c3: #12a5a0; --c4: #7b84a8;
  --cat4: #eda100; --cat5: #e87ba4; --cat6: #008300; --cat7: #a066cc; --cat8: #e34948;
  --good: #0ca30c; --good-ink: #0a7a0a; --warn: #fab219; --warn-ink: #8a5a00; --serious: #ec835a; --crit: #d03b3b; --crit-ink: #b42a2a; --info-ink: #2338b8;
  --good-wash: rgba(12,163,12,.10); --warn-wash: rgba(250,178,25,.18); --crit-wash: rgba(208,59,59,.10); --info-wash: rgba(24,53,179,.08);
  --seq-0: #eef1ff; --seq-1: #d5ddff; --seq-2: #b5c3fb; --seq-3: #94a8f4; --seq-4: #7088ea; --seq-5: #4d68dc; --seq-6: #2f4ccb; --seq-7: #1a34a8;
  --hex-bg: linear-gradient(135deg, rgba(134,199,237,.50), rgba(160,102,204,.30));
  --lg-azul: #1835b3; --lg-roxo: #a066cc; --lg-ceu: #86c7ed; --lg-txt: #050816;
  --shadow: 0 1px 2px rgba(20,32,100,.05), 0 10px 28px rgba(20,32,100,.06);
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080d26; --surface: #0f1640; --surface-2: #141c4b; --ink: #eef1ff; --ink-2: #b9c1e3; --muted: #8e97c2;
    --line: #232d66; --grid: #1a2358; --hover: #17214f;
    --accent: #7f98ff; --accent-ink: #a6b7ff; --accent-wash: rgba(127,152,255,.14); --accent-bar: rgba(106,134,245,.34); --chart: #6a86f5; --btn-bg: #7f98ff; --btn-ink: #0a1033;
    --side-bg: #0b1137; --side-ink: #a9b2da; --side-line: #1e2860; --side-hover: #131b4a; --side-active: rgba(127,152,255,.16);
    --ml: #3b8fdc; --sh: #d95926; --c3: #1fa89a; --c4: #8f99c4;
    --cat4: #c98500; --cat5: #d55181; --cat6: #008300; --cat7: #a46bd6; --cat8: #e66767;
    --good: #0ca30c; --good-ink: #46c946; --warn-ink: #f0b73a; --crit: #e0524f; --crit-ink: #f08381; --info-ink: #a6b7ff;
    --good-wash: rgba(12,163,12,.16); --warn-wash: rgba(250,178,25,.16); --crit-wash: rgba(224,82,79,.16); --info-wash: rgba(127,152,255,.16);
    --seq-0: #151d58; --seq-1: #1b2a7c; --seq-2: #23399f; --seq-3: #3351c4; --seq-4: #4c6ae0; --seq-5: #6f88f0; --seq-6: #98abf8; --seq-7: #c4d0ff;
    --hex-bg: linear-gradient(135deg, rgba(134,199,237,.28), rgba(160,102,204,.34));
    --lg-azul: #6f8dff; --lg-roxo: #b585e0; --lg-ceu: #86c7ed; --lg-txt: #f3f5ff;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.30);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080d26; --surface: #0f1640; --surface-2: #141c4b; --ink: #eef1ff; --ink-2: #b9c1e3; --muted: #8e97c2;
  --line: #232d66; --grid: #1a2358; --hover: #17214f;
  --accent: #7f98ff; --accent-ink: #a6b7ff; --accent-wash: rgba(127,152,255,.14); --accent-bar: rgba(106,134,245,.34); --chart: #6a86f5; --btn-bg: #7f98ff; --btn-ink: #0a1033;
  --side-bg: #0b1137; --side-ink: #a9b2da; --side-line: #1e2860; --side-hover: #131b4a; --side-active: rgba(127,152,255,.16);
  --ml: #3b8fdc; --sh: #d95926; --c3: #1fa89a; --c4: #8f99c4;
  --cat4: #c98500; --cat5: #d55181; --cat6: #008300; --cat7: #a46bd6; --cat8: #e66767;
  --good: #0ca30c; --good-ink: #46c946; --warn-ink: #f0b73a; --crit: #e0524f; --crit-ink: #f08381; --info-ink: #a6b7ff;
  --good-wash: rgba(12,163,12,.16); --warn-wash: rgba(250,178,25,.16); --crit-wash: rgba(224,82,79,.16); --info-wash: rgba(127,152,255,.16);
  --seq-0: #151d58; --seq-1: #1b2a7c; --seq-2: #23399f; --seq-3: #3351c4; --seq-4: #4c6ae0; --seq-5: #6f88f0; --seq-6: #98abf8; --seq-7: #c4d0ff;
  --hex-bg: linear-gradient(135deg, rgba(134,199,237,.28), rgba(160,102,204,.34));
  --lg-azul: #6f8dff; --lg-roxo: #b585e0; --lg-ceu: #86c7ed; --lg-txt: #f3f5ff;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.30);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--brand-3); color: #0d1330; }
svg { display: block; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
/* logo (símbolo + palavra em SVG, nas cores da marca; no tema escuro a palavra fica clara e o azul-royal sobe de tom) */
.lg { display: block; overflow: visible; }
.lg-azul { fill: var(--lg-azul); stroke: var(--lg-azul); stroke-width: var(--lg-sw, .6px); stroke-linejoin: round; }
.lg-roxo { fill: var(--lg-roxo); stroke: var(--lg-roxo); stroke-width: var(--lg-sw, .6px); stroke-linejoin: round; }
.lg-ceu { fill: var(--lg-ceu); stroke: var(--lg-ceu); stroke-width: var(--lg-sw, .6px); stroke-linejoin: round; }
.lg-txt { fill: var(--lg-txt); }

/* ------------------------------------------------------------------ estrutura */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side-bg); color: var(--side-ink); border-right: 1px solid var(--side-line); padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 18px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 2px 6px 16px; border-bottom: 1px solid var(--side-line); }
.brand .lg-full { width: 150px; height: auto; aspect-ratio: 339 / 196; }
.brand .lg-hm, .brand .lg-hw { display: none; }
.brand-cap { display: flex; align-items: center; gap: 10px; font-size: 10.5px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.brand-cap::before, .brand-cap::after { content: ''; width: 18px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--brand), var(--brand-2), var(--brand-3)); }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav button { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 12px; background: transparent; color: var(--side-ink); font-weight: 650; font-size: 13.5px; text-align: left; width: 100%; }
.nav button:hover { background: var(--side-hover); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--side-active); color: var(--accent); font-weight: 750; }
.nav button[aria-current="page"]::before { content: ''; position: absolute; left: -16px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); }
.nav .badge { margin-left: auto; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 700; text-align: center; }
.filtros { display: flex; flex-direction: column; gap: 12px; padding: 14px; background: var(--surface-2); border: 1px solid var(--side-line); border-radius: 16px; }
.filtros h2 { margin: 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 800; display: flex; align-items: center; justify-content: space-between; }
.filtros h2 button { border: 0; background: none; color: var(--accent); font-size: 12px; font-weight: 700; text-transform: none; letter-spacing: 0; padding: 0; }
.filtros h2 .f-toggle { color: var(--muted); font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; cursor: default; display: inline-flex; gap: 6px; align-items: center; }
.filtros .chev { display: none; }
.f-body { display: flex; flex-direction: column; gap: 12px; }
.f { display: flex; flex-direction: column; gap: 5px; }
.f label { font-size: 12px; color: var(--ink-2); font-weight: 650; }
.f select, .f input[type="date"] { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; }
.f select:focus, .f input[type="date"]:focus { border-color: var(--accent); }
.f .datas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.side-foot { margin-top: auto; padding: 12px 6px 0; border-top: 1px solid var(--side-line); font-size: 12px; color: var(--muted); display: flex; gap: 9px; align-items: flex-start; }
.side-foot b { color: var(--ink); font-weight: 650; display: block; }
.main { padding: 0 34px 56px; min-width: 0; }
.main::before { content: ''; display: block; height: 4px; margin: 0 -34px 26px; background: linear-gradient(90deg, var(--brand) 0 38%, var(--brand-2) 38% 70%, var(--brand-3) 70% 100%); }
.topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.topo h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.025em; line-height: 1.12; text-wrap: balance; }
.topo p { margin: 6px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 780px; }
.topo-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--good); } .dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); }
.ativos { display: flex; gap: 8px; flex-wrap: wrap; margin: -8px 0 16px; }
.ativos .chip { background: var(--accent-wash); border-color: transparent; color: var(--accent); }
.ativos .chip button { border: 0; background: none; padding: 0; color: var(--accent); display: grid; place-items: center; opacity: .75; }
.ativos .chip button:hover { color: var(--crit); opacity: 1; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 11px 15px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 12px; font-size: 13.5px; }
.banner.warn { background: var(--warn-wash); border-color: rgba(250,178,25,.45); }
.banner.crit { background: var(--crit-wash); border-color: rgba(208,59,59,.4); }
.banner.info { background: var(--info-wash); border-color: rgba(24,53,179,.22); }
.banner .ico { margin-top: 1px; }
.banner b { font-weight: 700; }
/* título de seção: hexágono da marca + linha */
.sec-t { display: flex; align-items: center; gap: 12px; margin: 28px 2px 12px; }
.sec-t:first-child { margin-top: 6px; }
.sec-t h2 { margin: 0; font-size: 11.5px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.sec-t h2::before { content: ''; width: 12px; height: 13px; background: linear-gradient(135deg, var(--brand-3), var(--brand-2) 55%, var(--brand)); clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); flex: none; }
.sec-t span { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sec-t::after { content: ''; flex: 1 1 24px; height: 1px; background: var(--line); }

/* ------------------------------------------------------------------ cartões, KPIs, tabelas */
.grade { display: grid; gap: 16px; margin-bottom: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.grade > * { min-width: 0; }
.s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; } .s3 { grid-column: span 3; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-h > div:first-child { flex: 1 1 220px; min-width: 0; }
.card-h h3 { margin: 0; font-size: 15.5px; font-weight: 750; letter-spacing: -.01em; }
.card-h p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
.card-a { display: flex; gap: 6px; flex: none; flex-wrap: wrap; max-width: 100%; }
.card-a .seg { max-width: 100%; overflow-x: auto; }
.btn-i { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 9px; padding: 5px 9px; font-size: 12px; font-weight: 650; display: inline-flex; align-items: center; gap: 5px; }
.btn-i:hover { background: var(--hover); }
.btn-i[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); border-color: transparent; }
.grafico { width: 100%; min-height: 240px; flex: 1 1 auto; }
.grafico.alto { min-height: 330px; } .grafico.mid { min-height: 420px; } .grafico.xalto { min-height: 500px; } .grafico.baixo { min-height: 190px; flex: none; }
.kpis { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-bottom: 16px; }
.kpis.c3, .kpis.c5, .kpis.c6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 1250px) { .kpis.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1560px) { .kpis.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (min-width: 1700px) { .kpis.c6 { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 5px; min-width: 0; position: relative; }
.kpi-top { display: flex; flex-direction: row-reverse; justify-content: space-between; align-items: flex-start; gap: 9px; color: var(--ink-2); font-size: 12.5px; font-weight: 650; line-height: 1.3; }
.kpi-ic { width: 34px; height: 34px; background: var(--hex-bg); color: var(--accent); display: grid; place-items: center; flex: none; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); }
.kpi-ic .ico { width: 16px; height: 16px; }
.kpi-v { font-size: 26px; font-weight: 800; letter-spacing: -.025em; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi-s { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px 8px; min-height: 30px; flex-wrap: wrap; }
.kpi-s > div { min-width: 0; }
.kpi-s .spark { margin-left: auto; max-width: 100%; }
.kpi-sub { font-size: 12px; color: var(--muted); line-height: 1.35; }
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.delta .ico { width: 11px; height: 11px; stroke-width: 2.6; }
.delta.up { color: var(--good-ink); background: var(--good-wash); } .delta.down { color: var(--crit-ink); background: var(--crit-wash); } .delta.zero { color: var(--muted); background: var(--surface-2); }
.spark { flex: none; }
.hero { background: linear-gradient(125deg, #1835b3 0%, #3a3fc4 50%, #7e48b9 100%); color: #fff; border: 0; overflow: hidden; box-shadow: 0 14px 34px rgba(24,53,179,.28); height: 100%; }
.hero > * { position: relative; }
.hero .partilha { margin-top: auto; }
.hero .kpi-s + .partilha { padding-top: 0; }
.dst { display: grid; margin-top: 12px; }
.dst > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; padding: 9px 2px; border-top: 1px solid var(--line); }
.dst span { color: var(--ink-2); } .dst b { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.hero .hero-wm { position: absolute; right: -40px; top: 46%; width: 250px; height: auto; aspect-ratio: 207 / 119; pointer-events: none; opacity: 1; --lg-azul: rgba(255,255,255,.11); --lg-roxo: rgba(255,255,255,.17); --lg-ceu: rgba(255,255,255,.09); --lg-sw: 0; }
.hero .kpi-top, .hero .kpi-sub { color: rgba(255,255,255,.82); }
.hero .kpi-ic { background: rgba(255,255,255,.18); color: #fff; }
.hero .kpi-v { font-size: 50px; font-weight: 800; letter-spacing: -.03em; margin-top: 8px; }
.hero .delta.up { color: #8af5ac; background: rgba(138,245,172,.16); } .hero .delta.down { color: #ffc2bf; background: rgba(255,194,191,.16); } .hero .delta.zero { color: rgba(255,255,255,.75); background: rgba(255,255,255,.12); }
.partilha { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.partilha div { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 9px 11px; }
.partilha span { display: block; font-size: 11.5px; color: rgba(255,255,255,.78); font-weight: 650; }
.partilha b { font-size: 16px; font-weight: 800; }
.barra-ads { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; }
.barra-ads label { font-weight: 700; color: var(--ink-2); }
.sel { padding: 8px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; max-width: 100%; }
.partilha-k { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.partilha-k div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.partilha-k span { display: block; font-size: 12.5px; color: var(--ink-2); font-weight: 650; }
.partilha-k b { font-size: 24px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tw { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }

<script>
'use strict';
/* =================================================================================================== utilitários */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NF = [0, 1, 2].map(n => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: n, maximumFractionDigits: n }));
const BRLF = [0, 2].map(n => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: n, maximumFractionDigits: n }));
const ok = v => v != null && isFinite(v);
const brl = (v, nd = 0) => ok(v) ? ((v < 0 && Math.abs(v) >= (nd ? 0.005 : 0.5)) ? '−' : '') + BRLF[nd ? 1 : 0].format(Math.abs(v)) : '–';
const brlk = v => { if (!ok(v)) return '–'; const a = Math.abs(v), s = v < 0 ? '−' : ''; if (a >= 1e6) return s + 'R$ ' + NF[1].format(a / 1e6) + ' mi'; if (a >= 1e4) return s + 'R$ ' + NF[1].format(a / 1e3) + ' mil'; return s + BRLF[0].format(a); };
const num = (v, nd = 0) => ok(v) ? (v < 0 && Math.abs(v) >= 0.5 * Math.pow(10, -nd) ? '−' : '') + NF[nd].format(Math.abs(v)) : '–';
const pct = (v, nd = 1) => ok(v) ? (v < 0 && Math.abs(v) * 100 >= 0.5 * Math.pow(10, -nd) ? '−' : '') + NF[nd].format(Math.abs(v) * 100) + '%' : '–';
const pp = v => ok(v) ? (v < 0 ? '−' : '+') + NF[1].format(Math.abs(v) * 100) + ' p.p.' : '–';
const sgn = (v, f) => ok(v) ? (v < 0 ? '−' : '+') + f(Math.abs(v)) : '–';

const D1 = 864e5;
const pD = s => new Date(s + 'T00:00:00Z');
const fD = t => t.toISOString().slice(0, 10);
const addD = (s, n) => fD(new Date(pD(s).getTime() + n * D1));
const diffD = (a, b) => Math.round((pD(b) - pD(a)) / D1);
const dd = s => s.slice(8, 10) + '/' + s.slice(5, 7);
const DOW = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const DOWL = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const dowOf = s => pD(s).getUTCDay();
const rangeD = (a, b) => { const o = []; for (let d = a; d <= b; d = addD(d, 1)) o.push(d); return o; };

const addMes = (s, n) => {
  const y = +s.slice(0, 4), m = +s.slice(5, 7) - 1, d = +s.slice(8, 10);
  const t = new Date(Date.UTC(y, m + n, 1));
  const ult = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  return fD(new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), Math.min(d, ult))));
};
const diaLongo = s => { const t = pD(s); return DOWL[t.getUTCDay()] + ', ' + t.getUTCDate() + ' de ' + MESES[t.getUTCMonth()] + ' de ' + t.getUTCFullYear(); };

    }, { axisPointer: { type: 'shadow', shadowStyle: { color: t.grid, opacity: .35 } } }),

function marginais(sel, lista) {                     // ROAS dos últimos dias: diferença entre o relatório escolhido e o anterior (mesmo início de período)

}

      <p class="meta" style="margin:0">Custo atual no Cadastro: ${ok(dm.cu) ? brl(dm.cu, 2) : 'sem custo'}${dm.em ? ' + embalagem ' + brl(dm.em, 2) : ''}${dm.fo ? ' · origem: ' + esc(dm.fo) : ''}.</p></section>
    ${canais.length ? `<section class="card" style="box-shadow:none"><div class="card-h"><div><h3>Por canal</h3></div></div><div class="tw">${tabelaHtml([{ t: 'Canal' }, { t: 'Receita', v: 1 }, { t: 'Un.', v: 1 }, { t: 'Preço', v: 1 }, { t: 'Lucro*', v: 1 }, { t: 'Margem*', v: 1 }],

REG.prod = function (el, { p, cm, f }) {

    const k = PROD.ord, dir = PROD.dir;
    v.sort((a, b) => { const x = a[k], y = b[k]; if (k === 'sku') return dir * String(x).localeCompare(String(y), 'pt-BR'); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return dir * (x - y); });
    return v;
  };
  const tabela = () => {
    const v = lista(), mostra = PROD.todos ? v : v.slice(0, 40);
    if (!v.length) return vazioHtml('Nenhum produto encontrado', 'Ajuste a busca ou o filtro de situação.');
    const th = PCOLS.map(c => c.k ? `<th class="${c.v ? 'v' : ''}" aria-sort="${PROD.ord === c.k ? (PROD.dir < 0 ? 'descending' : 'ascending') : 'none'}"><button type="button" data-o="${c.k}">${esc(c.t)}${PROD.ord === c.k ? (PROD.dir < 0 ? ' ↓' : ' ↑') : ''}</button></th>` : `<th>${esc(c.t)}</th>`).join('');
    const linhas = mostra.map(o => `<tr class="clic" data-k="${esc(o.sku)}" tabindex="0"><td><span class="sku">${esc(o.sku)}</span>${o.flag === 'missing' ? ' <span class="pill warn">sem custo</span>' : ''}<br><span class="meta">${esc((o.nome || '').length > 58 ? o.nome.slice(0, 56) + '…' : (o.nome || ''))}</span></td>` +

/* =================================================================================================== CAIXA */
function carteiraDias(p) {                      // dias da carteira dentro do período, com os dias sem movimento preenchidos (o saldo segue o do dia anterior)
  const w = DB.fin.carteira; if (!w || !w.dias || !w.dias.length) return null;
  const de = p.de > w.de ? p.de : w.de, ate = p.ate < w.ate ? p.ate : w.ate;
  if (de > ate) return null;
  const idx = {}; for (const x of w.dias) idx[x.d] = x;
  let saldo = null; for (const x of w.dias) { if (x.d < de) saldo = x.saldo; }
  return { w, de, ate, dias: rangeD(de, ate).map(d => { const x = idx[d]; if (x) { saldo = x.saldo; return Object.assign({ mov: true }, x); } return { d, lib: 0, n_lib: 0, saque: 0, difal: 0, n_difal: 0, outros: 0, saldo, mov: false }; }) };
}
function chCaixa(t, dias) {
  const cats = dias.map(x => x.d);

  const tit = (txt, top) => ({ text: txt, left: 4, top, textStyle: { color: t.muted, fontSize: 11.5, fontWeight: 600, fontFamily: t.font } });
  return {
    textStyle: { fontFamily: t.font }, animationDuration: 350, axisPointer: { link: [{ xAxisIndex: 'all' }] },
    legend: legendBase(t, { data: ['Liberado pelos pedidos', 'Saques', 'Saldo da carteira'] }),
    tooltip: tooltipBase(t, ps => {
      const x = dias[ps[0].dataIndex]; if (!x) return '';
      const L = [{ nome: 'Liberado pelos pedidos', cor: t.accent, valor: brl(x.lib) + (x.n_lib ? ` · ${num(x.n_lib)} pedidos` : '') }, { nome: 'Saques', cor: t.c4, valor: x.saque ? '−' + brl(x.saque) : '–' }];
      if (x.difal) L.push({ nome: 'DIFAL', cor: t.cat8, valor: '−' + brl(x.difal, 2) + (x.n_difal ? ` · ${num(x.n_difal)}` : '') });
      if (x.outros) L.push({ nome: 'Outros ajustes', cor: t.muted, valor: sgn(x.outros, v => brl(v, 2)) });
      L.push({ nome: 'Saldo no fim do dia', cor: t.ink2, valor: brl(x.saldo) });
      return tipLinhas(t, cap(diaLongo(x.d)), L, x.mov ? '' : 'Sem movimento na carteira.');
    }),
    title: [tit('Entradas e saídas por dia', 28), tit('Saldo no fim do dia', 268)],
    grid: [gridBase({ top: 54, height: 180 }), gridBase({ top: 296, height: 90, bottom: 28 })],
    xAxis: [eixoX(0, false), eixoX(1, true)],
    yAxis: [axY(t, { gridIndex: 0 }), axY(t, { gridIndex: 1, splitNumber: 2 })],

/* mesmas fórmulas do fechamento (sem despesas operacionais quando o mês as deixa de fora: fixos_ambos = 0) */
function projetaMes(P, s) {
  const dias = P.dias_mes, fatA = s.vA * dias, fatB = s.vB * dias;
  const lopA = fatA * (P.mc_A + s.mc - P.ads_pct_A), lopB = fatB * (P.mc_B + s.mc - s.adsB);
  const impPctX = s.f3 ? (P.imposto_pct_f3 || P.imposto_pct) : P.imposto_pct, imposto = impPctX * (fatA + fatB), ambos = P.fixos_ambos + imposto, baseA = lopA - ambos;
  const jA = baseA * P.pct_joao_A - P.so_joao + P.pago_joao, dA = baseA * P.pct_doug_A - P.so_doug + P.pago_doug, jB = lopB * P.pct_joao_B, dB = lopB * P.pct_doug_B;
  const j = jA + jB, dg = dA + dB, fu = P.fundo_pct, vt = s.vA + s.vB;
  const mixLiq = vt > 0 ? (s.vA * (P.mc_A + s.mc - P.ads_pct_A) + s.vB * (P.mc_B + s.mc - s.adsB)) / vt - impPctX : 0;
  return { fat: fatA + fatB, mcBruto: fatA * (P.mc_A + s.mc) + fatB * (P.mc_B + s.mc), ads: fatA * P.ads_pct_A + fatB * s.adsB, imposto, fixos: P.fixos_ambos, total: j + dg, joao: j, douglas: dg, fundo: (j + dg) * fu,
    joaoLiq: j * (1 - fu), dougLiq: dg * (1 - fu), eqDia: mixLiq > 0 ? P.fixos_ambos / (dias * mixLiq) : Infinity, mixLiq };
}
const simPadraoMes = P => ({ vA: P.vendas_dia_A, vB: P.vendas_dia_B, adsB: P.ads_pct_B, mc: 0, f3: false });

function statusMes(D, lucro) {
  const rb = refBase(D);

  if (rb && lucro >= 0.5 * rb) return { cls: 'warn', txt: 'Abaixo de setembro' };
  if (rb) return { cls: 'crit', txt: 'Bem abaixo de setembro' };
  return { cls: 'good', txt: 'Projeção positiva' };
}

        <div class="ctrl"><label for="s-mc">Margem antes de Ads (± pontos) <span id="s-mc-v"></span></label><input type="range" id="s-mc" min="-5" max="5" step="0.5"><span class="hint">Para testar preço, custo ou frete: 1 ponto = 1% da receita bruta.</span></div>
        <label class="chk"><input type="checkbox" id="s-f3"> RBT12 acima de R$ 360 mil (Simples na faixa 3)</label></div>
      <div class="sim-out"><div class="tw"><table class="t" id="sim-tab"></table></div><div class="bigline"><span>Lucro a distribuir</span><b id="sim-lucro">–</b></div><div class="bigline"><span>João a receber</span><b id="sim-j">–</b></div><div class="bigline"><span>Douglas a receber</span><b id="sim-d">–</b></div><p class="meta" id="sim-eq" style="margin:10px 0 0"></p></div></div>` })}</div>
    ${secao('Cenários e premissas')}
    <div class="grade">${cartao({ id: 'cen', titulo: 'Cenários do mês', sub: 'Quanto o mês rende em cada ritmo de vendas', cls: 's7', corpo: cenTab })}
      ${cartao({ id: 'prem', titulo: 'Premissas da projeção', sub: 'O que está por trás dos números', cls: 's5', corpo: `<dl class="kv">${prem.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` })}</div>
    ${secao('Como lucrar mais')}
    <div class="grade">${cartao({ id: 'sug', titulo: 'O que fazer para lucrar mais', sub: sugs.length ? `${sugs.length} ações, da que mais pesa para a que menos pesa · revisadas em ${esc(D.atualizado_em || '–')}` : '', cls: 's12', corpo: `<div class="sug">${sugs.map(cartaoSug).join('') || '<p class="meta">As sugestões aparecem aqui quando o Claude registrar os números do mês.</p>'}</div>
      <div class="ai-box" id="ai-box" ${window.__sample ? '' : 'hidden'}><div class="ai-row"><button type="button" class="btn-p" id="ai-btn">Pedir sugestões novas ao Claude</button><button type="button" class="btn-i" id="ai-stop" hidden>Parar</button><span class="meta" id="ai-status">${esc(MES.aiStatus || 'Usa os números do painel e o cenário do simulador. Gasta um pouco do seu uso do Claude.')}</span></div><div class="sug" id="ai-out">${MES.aiHtml}</div></div>` })}</div>
    ${D.notas ? `<p class="rodape">${esc(D.notas)}</p>` : ''}`;
  /* gráfico de projeção */
  const dataTab = real ? () => ({ cols: [{ t: 'Dia' }, { t: 'Lucro acumulado', v: 1 }], rows: real.map((v, i) => [`${i + 1}/${MES.atual.slice(5, 7)}`, brl(v)]) }) : null;
  ligaCards([{ id: 'proj', vazio: real ? null : { t: 'Sem dados diários para este mês', d: 'O gráfico aparece quando houver vendas diárias carregadas.' },
    build: t => chProjecao(t, { dias: P.dias_mes, real, cen: mostraProj ? cen : [], ref: !fechado && rb != null ? rb : null, refTxt: 'Setembro ' + brlMil(rb), estreito: ($('#g-proj') || el).clientWidth < 640 }), tabela: dataTab }]);
  /* simulador */
  const $s = id => $('#' + id);
  const syncControles = () => { const s = MES.sim; $s('s-vb').value = s.vB; if ($s('s-va')) $s('s-va').value = s.vA; $s('s-ads').value = s.adsB * 100; $s('s-mc').value = s.mc * 100; $s('s-f3').checked = s.f3; };
  const renderSim = () => {
    const s = MES.sim, r = projetaMes(P, s);
    $s('s-vb-v').textContent = brlMil(s.vB); $s('s-vb-h').textContent = `${brlMil(s.vB * P.dias_mes)} no mês · ritmo atual ${brlMil(P.vendas_dia_B)}/dia`;
    if ($s('s-va')) { $s('s-va-v').textContent = brlMil(s.vA); $s('s-va-h').textContent = `${brlMil(s.vA * P.dias_mes)} no mês · ritmo atual ${brlMil(P.vendas_dia_A)}/dia`; }
    $s('s-ads-v').textContent = pct(s.adsB, 2); $s('s-ads-h').textContent = `${brl(s.vB * P.dias_mes * s.adsB)} no mês · agora em ${pct(P.ads_pct_B, 2)}`;
    $s('s-mc-v').textContent = (s.mc >= 0 ? '+' : '−') + String(Math.abs(s.mc * 100)).replace('.', ',') + ' pt';
    const rows = [['Receita bruta do mês', r.fat, 0], ['Margem antes de Ads', r.mcBruto, 0], ['(−) Ads', -r.ads, 1], ['(−) Imposto estimado', -r.imposto, 1]];
    if (!D.sem_opex) rows.push([sp ? '(−) Despesas operacionais' : '(−) Despesas operacionais (saem do grupo A)', -r.fixos, 1]);
    $s('sim-tab').innerHTML = '<tbody>' + rows.map(([l, v, sb]) => `<tr class="${sb ? 'sub' : ''}"><td>${esc(l)}</td><td class="v">${brl(v)}</td></tr>`).join('') + '</tbody>';
    $s('sim-lucro').textContent = brl(r.total); $s('sim-lucro').className = r.total < 0 ? 'neg' : '';
    $s('sim-j').textContent = brl(r.joaoLiq); $s('sim-d').textContent = brl(r.dougLiq);
    const div = sp ? `o lucro divide ${pct(P.pct_joao_B, 0)} para o João e ${pct(P.pct_doug_B, 0)} para o Douglas` : 'as panelas dividem 40/60 e o grupo MedService 35/65';
    $s('sim-eq').textContent = D.sem_opex ? `Sem despesas operacionais na conta, o lucro é a margem depois de Ads e imposto. João e Douglas já descontam o fundo de caixa de ${pct(P.fundo_pct, 0)}; ${div}.`
      : isFinite(r.eqDia) ? `Neste cenário o equilíbrio é ${brlMil(r.eqDia)} de receita bruta por dia. João e Douglas já descontam o fundo de caixa de ${pct(P.fundo_pct, 0)}; ${div}.` : 'Neste cenário a margem não cobre Ads e imposto: nenhum volume dá lucro.';
  };
  const lerControles = () => { MES.sim = { vB: +$s('s-vb').value, vA: $s('s-va') ? +$s('s-va').value : P.vendas_dia_A, adsB: +$s('s-ads').value / 100, mc: +$s('s-mc').value / 100, f3: $s('s-f3').checked }; renderSim(); };
  ['s-vb', 's-va', 's-ads', 's-mc'].forEach(id => { if ($s(id)) $s(id).addEventListener('input', lerControles); });
  $s('s-f3').addEventListener('change', lerControles);
  $s('sim-reset').addEventListener('click', () => { MES.sim = simPadraoMes(P); syncControles(); renderSim(); });
  syncControles(); renderSim();
  $s('mes-sel').addEventListener('change', e => { MES.atual = e.target.value; MES.aiHtml = ''; MES.aiStatus = ''; render(); });
  /* sugestões novas (Claude) */
  const COPY = { not_granted: 'Você não autorizou o painel a usar o Claude. As sugestões acima continuam valendo.', sampling_disabled: 'O Claude não está disponível nesta conta.', rate_limited: 'Muitos pedidos seguidos. Tente de novo daqui a pouco.',
    session_expired: 'Sua sessão expirou. Entre de novo no Claude e tente outra vez.', invalid_json: 'A resposta veio num formato inesperado. Tente de novo.', refused: 'O Claude não respondeu a esse pedido.', empty_completion: 'A resposta veio vazia. Tente de novo.' };
  const btn = $s('ai-btn');
  if (btn && window.__sample) {
    btn.addEventListener('click', async () => {
      const r = projetaMes(P, MES.sim);
      const dados = { mes: D.rotulo, estado: D.estado, dados_ate: D.dados_ate, dre: D.dre, resultado: D.resultado, indicadores: D.indicadores, referencia_setembro: D.referencia, premissas: P, produtos: D.produtos, anuncios: D.anuncios && { resumo: D.anuncios.por_sinal, lista: (D.anuncios.lista || []).slice(0, 10) },
        devolucoes: D.devolucoes, cenarios: D.cenarios, cenario_do_simulador: { vendas_dia_B: MES.sim.vB, vendas_dia_A: MES.sim.vA, ads_B_pct: MES.sim.adsB * 100, ajuste_margem_pt: MES.sim.mc * 100, faixa3: MES.sim.f3, lucro_mes: Math.round(r.total), joao: Math.round(r.joaoLiq), douglas: Math.round(r.dougLiq) },
        sugestoes_ja_dadas: (D.sugestoes || []).map(s => s.titulo), contexto: D.contexto || '' };
      const prompt = 'Você é o consultor financeiro de uma empresa que vende ' + (sp ? 'material médico-hospitalar e papel' : 'material médico-hospitalar, papel e panelas') + ' no Mercado Livre e na Shopee (MedService, dois sócios: João e Douglas). ' +
        'Com os números abaixo (em reais), proponha até 5 ações práticas para aumentar o lucro a distribuir, diferentes das já dadas. Seja concreto, use os números e diga a premissa de cada estimativa. Escreva em português do Brasil, frases curtas.\n' +
        'Responda só com um JSON array de objetos {"titulo": string, "impacto_mes": number (R$ por mês estimado, 0 se não der para estimar), "texto": string (o porquê, 1-2 frases), "acao": string (o que fazer esta semana)}.\n\nDADOS:\n' + JSON.stringify(dados);
      MES.ctl = new AbortController(); btn.disabled = true; $s('ai-stop').hidden = false; $s('ai-status').textContent = 'Pensando… (pode levar até um minuto)'; $s('ai-out').innerHTML = '';
      try {
        const lista = await window.__sample.json(prompt, { signal: MES.ctl.signal, cache: false });
        const itens = Array.isArray(lista) ? lista.filter(x => x && x.titulo) : [];
        MES.aiHtml = itens.map(x => cartaoSug({ titulo: String(x.titulo), impacto_mes: Number(x.impacto_mes) || 0, texto: String(x.texto || ''), acao: String(x.acao || ''), status: 'nova' })).join('');
        MES.aiStatus = itens.length ? 'Sugestões geradas agora. Confira os números antes de agir e me conte no chat o que decidir.' : 'Não vieram sugestões. Tente de novo.';
      } catch (e) {
        if (e && e.code === 'cancelled') MES.aiStatus = 'Parado.';
        else if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) { MES.aiStatus = COPY[e.code] || 'Indisponível nesta visualização.'; btn.hidden = true; }
        else MES.aiStatus = (e && COPY[e.code]) || 'Não deu certo agora. Tente de novo em instantes.';
      } finally {
        if ($s('ai-out')) { $s('ai-out').innerHTML = MES.aiHtml; $s('ai-status').textContent = MES.aiStatus; btn.disabled = false; $s('ai-stop').hidden = true; }
        MES.ctl = null;
      }
    });
    $s('ai-stop').addEventListener('click', () => MES.ctl && MES.ctl.abort());
  }
};

/* =================================================================================================== DADOS E ALERTAS */
const dmParaIso = (s, ano) => (s && /^\d\d\/\d\d/.test(s)) ? `${ano}-${s.slice(3, 5)}-${s.slice(0, 2)}` : null;
function statusData(ate) {
  if (!ate) return ['mute', 'Sem dados'];
  const atraso = diffD(ate, hojeStr()) - 1;
  if (atraso <= 0) return ['good', 'Em dia'];
  return [atraso >= 3 ? 'crit' : 'warn', `Atrasado ${atraso} dia${atraso > 1 ? 's' : ''}`];
}

REG.dados = function (el, { p, f }) {
  const mes = monthOf(M.last), fo = M.fontes[mes] || {}, mm = mesDoc(mes), ano = mes.slice(0, 4);
  const al = calcAlertas(), w = DB.fin.carteira, snaps = anuncios(), ex = DB.anuncios.extrato;
  const ultDev = docsEm(M.first, M.last).filter(x => x.dm && x.dm.length).map(x => x.d).pop();
  const par = (M.docs[M.last].ok || {}).SH === 'parcial';
  const fonteLinha = (nome, ate, det) => { const [c, t] = statusData(ate); return [`<b>${esc(nome)}</b>${det ? `<br><span class="meta">${det}</span>` : ''}`, ate ? dd(ate) + '/' + ate.slice(2, 4) : '–', `<span class="pill ${c}">${esc(t)}</span>`]; };
  const fontes = [
    fonteLinha('Shopee: pedidos (Order.all)', fo.sh_completo, par ? `${dd(M.last)} parcial até ${esc(fo.sh_parcial_hora || '')} · último pedido ${esc((fo.sh_ultimo_pedido || '').slice(5, 16).replace('-', '/').replace(' ', ' '))}` : `último pedido ${esc(fo.sh_ultimo_pedido || '–')}`),
    fonteLinha('Mercado Livre: vendas (Vendas BR)', fo.ml_completo, `última venda ${esc((fo.ml_ultima_venda || '–').slice(5, 16).replace('-', '/'))}${fo.ml_completo && fo.sh_completo && fo.ml_completo < fo.sh_completo ? ' · dias depois disso mostram só a Shopee' : ''}`),
    fonteLinha('Shopee: devoluções e cancelamentos', ultDev, 'motivos e produtos devolvidos (Order.return_refund_cancel)'),
    fonteLinha('Shopee: anúncios (Dados Gerais)', snaps.length ? snaps[snaps.length - 1].ate : null, `${snaps.length} relatório${snaps.length === 1 ? '' : 's'} guardado${snaps.length === 1 ? '' : 's'}`),
    fonteLinha('Shopee: extrato de anúncios', ex ? ex.ate : null, 'gasto real, créditos e recargas por dia'),
    fonteLinha('Shopee: carteira', w ? w.ate : null, w ? `até ${esc(w.hora_ate || '')}` : ''),
    fonteLinha('Cadastro de custos', fo.cadastro ? fo.cadastro.slice(0, 10) : null, fo.cadastro ? `lido em ${esc(fo.cadastro.slice(8, 10) + '/' + fo.cadastro.slice(5, 7) + ' ' + fo.cadastro.slice(11, 16))}` : ''),
    fonteLinha('Painel mensal (projeção)', mm ? dmParaIso(mm.atualizado_em, ano) : null, mm ? `atualizado em ${esc(mm.atualizado_em || '')}` : '')
  ];
  /* qualidade: custos e embalagens, ao vivo para o período escolhido */
  const sk = porSku(p.de, p.ate, Object.assign({}, f, { sku: null })).filter(o => o.bruta > 0 && o.un > 0);
  const pend = sk.filter(o => o.flag && o.flag !== 'ok').sort((a, b) => b.bruta - a.bruta);
  const semEmb = sk.filter(o => !o.flag && o.ins === 0 && !(dimOf(o.sku).em > 0)).sort((a, b) => b.bruta - a.bruta);
  const totB = sum(sk, o => o.bruta);
  const pillCusto = fl => fl === 'missing' ? '<span class="pill warn">provisório</span>' : '<span class="pill info">inferido</span>';
  const tPend = pend.length ? `<div class="tw">${tabelaHtml([{ t: 'Produto' }, { t: 'Situação' }, { t: 'Un.', v: 1 }, { t: 'Receita', v: 1 }, { t: 'Custo usado', v: 1 }],
    pend.slice(0, 12).map(o => ({ cls: 'clic', k: o.sku, c: [`<span class="sku">${esc(o.sku)}</span><br><span class="meta">${esc((o.fonte || '').slice(0, 90))}</span>`, pillCusto(o.flag), num(o.un), brl(o.bruta), o.flag === 'missing' ? '53,5% da receita' : brl(o.cuUn, 2)] })))}</div>` : vazioHtml('Todos os custos confirmados', 'Nenhum produto vendido com custo provisório ou inferido neste período.');
  const tEmb = semEmb.length ? `<div class="tw">${tabelaHtml([{ t: 'Produto' }, { t: 'Un.', v: 1 }, { t: 'Receita', v: 1 }, { t: 'A R$ 0,50/un.', v: 1 }], semEmb.slice(0, 8).map(o => ({ cls: 'clic', k: o.sku, c: [`<span class="sku">${esc(o.sku)}</span>`, num(o.un), brl(o.bruta), brl(o.un * 0.5)] })))}</div>` : vazioHtml('Embalagem em dia', 'Todos os produtos vendidos têm custo de embalagem.');
  /* decisões em aberto (do painel mensal) */
  const dec = [];
  if (mm && mm.carteira && mm.carteira.difal) dec.push({ t: 'DIFAL cobrado pela Shopee', v: brl(mm.carteira.difal, 2), d: `${num(mm.carteira.n_difal)} débitos na carteira (pedidos de agosto). Hoje não entra no custo de outubro. Lançar como custo do mês?` });
  if (mm && mm.ajuste_frete_shopee) dec.push({ t: 'Ajuste do frete da Shopee', v: brl(mm.ajuste_frete_shopee.por_mes) + '/mês', d: `A carteira mostra frete real maior que o estimado (${brl(mm.ajuste_frete_shopee.valor)} até agora, sobretudo em pedidos pesados). Ainda não aplicado nos números. Aplicar?` });
  if (mm && mm.devolucoes && mm.devolucoes.de_anteriores && mm.devolucoes.de_anteriores.pedidos) dec.push({ t: 'Reembolsos de pedidos de setembro', v: brl(mm.devolucoes.de_anteriores.reembolso, 2), d: `${num(mm.devolucoes.de_anteriores.pedidos)} pedidos de meses fechados com reembolso pedido em outubro. Contar em outubro?` });
  if (mm && mm.embalagens && mm.embalagens.sem && mm.embalagens.sem.n) dec.push({ t: 'Embalagem dos kits sem custo', v: brl(mm.embalagens.sem.un * 0.5), d: `${num(mm.embalagens.sem.n)} SKUs sem "Custo embalagem" no Cadastro (${brl(mm.embalagens.sem.bruta)} de receita). Preencha ou diga o valor.` });
  const decHtml = dec.length ? `<div class="sug">${dec.map(x => `<article><h4>${esc(x.t)}</h4><div class="imp">${esc(x.v)}</div><p>${esc(x.d)}</p></article>`).join('')}</div>` : vazioHtml('Nenhuma decisão em aberto', '');
  const mc = mm && mm.mudancas_custo, mcHtml = mc && mc.linhas && mc.linhas.length ? `<div class="tw">${tabelaHtml([{ t: 'Produto' }, { t: 'Un.', v: 1 }, { t: 'Custo antes', v: 1 }, { t: 'Custo agora', v: 1 }, { t: 'Efeito no lucro', v: 1 }], mc.linhas.map(x => [`<span class="sku">${esc(x.sku)}</span>`, num(x.un), brl(x.antes, 2), brl(x.depois, 2), `<span class="${x.efeito < 0 ? 'neg' : 'pos'}">${sgn(x.efeito, v => brl(v))}</span>`]))}</div>` : '';
  const pendList = mm && (mm.pendencias || []).length ? `<ul class="plain">${mm.pendencias.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : vazioHtml('Sem pendências registradas', '');
  const ev = (M.geral.eventos || []).slice().sort((a, b) => a.d < b.d ? -1 : 1);
  const comoEnviar = `<ol class="plain">
    <li><b>Mercado Livre:</b> "Vendas BR" (.xlsx), do primeiro dia do mês até hoje.</li><li><b>Shopee:</b> "Order.all" (.xlsx) e "Order.return_refund_cancel" (.zip) do mês.</li>
    <li><b>Anúncios:</b> "Dados Gerais de Anúncios" (.csv) e o extrato diário "adwords_bill" (.csv).</li><li><b>Carteira:</b> "my_balance_transaction_report" (.xlsx) da Shopee.</li>
    <li><b>Custos:</b> o painel lê o Cadastro da planilha compartilhada sozinho; avise quando mudar um custo.</li><li><b>Despesas, contas a pagar e a receber:</b> envie a planilha ou o CSV quando quiser vê-los aqui.</li></ol>
    <p class="meta" style="margin:10px 0 0">Mande tudo no chat com o Claude. Ele confere a loja de cada arquivo, calcula e atualiza este painel; nada é publicado sem o seu pedido.</p>`;
  el.innerHTML = `${secao('Alertas e fontes de dados')}<div class="grade">${cartao({ id: 'alr', titulo: 'Alertas', sub: al.length ? `${al.length} ponto${al.length > 1 ? 's' : ''} de atenção com os filtros atuais` : 'Nada a destacar', cls: 's7', corpo: al.length ? `<ul class="lista">${al.map(alertaHtml).join('')}</ul>` : vazioHtml('Nada a destacar', 'Nenhum alerta com os filtros atuais.') })}
      ${cartao({ id: 'fnt', titulo: 'De onde vêm os números', sub: `Hoje é ${esc(cap(diaLongo(hojeStr())))}`, cls: 's5', corpo: `<div class="tw">${tabelaHtml([{ t: 'Fonte' }, { t: 'Até', v: 1 }, { t: 'Situação' }], fontes)}</div>` })}</div>
    ${secao('Decisões em aberto')}
    <div class="grade">${cartao({ id: 'dec', titulo: 'Decisões em aberto', sub: 'Itens que mudam o lucro e esperam a sua resposta', cls: 's12', corpo: decHtml })}</div>
    ${secao('Qualidade dos custos')}
    <div class="grade">${cartao({ id: 'qcu', titulo: 'Custos para confirmar', sub: pend.length ? `${pend.length} produto${pend.length > 1 ? 's' : ''} · ${brl(sum(pend, o => o.bruta))} de receita (${pct(totB > 0 ? sum(pend, o => o.bruta) / totB : null)}). Clique para ver o produto.` : 'Custos provisórios ou inferidos no período', cls: 's7', corpo: tPend })}
      ${cartao({ id: 'qem', titulo: 'Embalagem sem custo', sub: semEmb.length ? `${semEmb.length} produto${semEmb.length > 1 ? 's' : ''} sem "Custo embalagem" no Cadastro` : 'Insumos de embalagem', cls: 's5', corpo: tEmb })}</div>
    ${mcHtml ? `<div class="grade">${cartao({ id: 'mcu', titulo: 'Custos novos no Cadastro', sub: `Lidos em ${esc(mc.lido_em)}: mudam o lucro até ${dd(mc.ate)} em ${sgn(mc.total, v => brl(v))}`, cls: 's12', corpo: mcHtml + `<p class="meta" style="margin:10px 0 0">A conta usa o custo do Cadastro em todas as unidades vendidas no mês; se o custo novo vale só para compras recentes, parte do estoque saiu mais caro e o lucro real fica entre o antigo e o novo.</p>` })}</div>` : ''}
    ${secao('Atualização do painel')}
    <div class="grade">${cartao({ id: 'pen', titulo: 'Para atualizar o painel', sub: mm ? `Pendências do painel mensal (${esc(mm.atualizado_em || '')})` : 'Pendências', cls: 's7', corpo: pendList })}
      ${cartao({ id: 'com', titulo: 'Como alimentar o painel', sub: 'O que enviar para atualizar', cls: 's5', corpo: comoEnviar })}</div>
    ${secao('Marcos nos gráficos')}
    <div class="grade">${cartao({ id: 'eve', titulo: 'Eventos marcados nos gráficos', sub: 'Aparecem como linhas verticais. Peça ao Claude para incluir campanhas, mudanças de preço ou de custo.', cls: 's12', corpo: ev.length ? `<div class="tw">${tabelaHtml([{ t: 'Dia' }, { t: 'Evento' }], ev.map(e => [dd(e.d) + '/' + e.d.slice(0, 4), esc(e.t)]))}</div>` : vazioHtml('Nenhum evento', '') })}</div>`;
  ligaLinhas($('#cc-qcu'), k => gavetaSku(k, p));
  ligaLinhas($('#cc-qem'), k => gavetaSku(k, p));
};

/* =================================================================================================== partida: banco do artefato, tema e redimensionamento */
(function () {
  ligaFiltros();
  try { new ResizeObserver(() => CH.forEach(c => { try { c.inst.resize(); } catch (e) { /* gráfico já descartado */ } })).observe($('#main')); } catch (e) { /* sem ResizeObserver */ }
  const claro = () => document.documentElement.getAttribute('data-theme') === 'light';
  const syncTema = () => { const b = $('#t-tema'); if (b) { b.innerHTML = (claro() ? ICON.sun : ICON.moon) + (claro() ? 'Tema claro' : 'Tema escuro'); b.title = claro() ? 'Mudar para o tema escuro' : 'Mudar para o tema claro'; } };
  syncTema();
  $('#t-tema').addEventListener('click', () => {
    const novo = claro() ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', novo);
    try { localStorage.setItem('med.tema', novo === 'light' ? 'claro' : 'escuro'); } catch (e) { /* sem armazenamento: vale só nesta visita */ }
  });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', agenda); } catch (e) { /* ignora */ }
  const desejado = () => { try { return localStorage.getItem('med.tema') === 'claro' ? 'light' : 'dark'; } catch (e) { return 'dark'; } };
  const t0 = Date.now();
  try {
    new MutationObserver(() => {
      // o visualizador pode aplicar o tema dele logo depois do carregamento: nos primeiros segundos vale o padrão escuro (ou a escolha guardada); depois, qualquer troca é aceita
      if (Date.now() - t0 < 2500 && document.documentElement.getAttribute('data-theme') !== desejado()) { document.documentElement.setAttribute('data-theme', desejado()); return; }
      syncTema(); agenda();
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (e) { /* ignora */ }
  function semBanco(msg) {
    $('#t-h1').textContent = 'Painel indisponível';
    $('#page').innerHTML = vazioHtml('Não consegui abrir o banco de dados do painel', msg || 'Entre na sua conta do Claude e abra o painel de novo.');
  }
  async function inicia() {
    if (!window.claude || typeof window.claude.use !== 'function') { semBanco('Este painel lê os números do banco do artefato, que só existe dentro do Claude.'); return; }
    let db = null;
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) { semBanco(); return; }
    try { window.__sample = await window.claude.use('sample'); } catch (e) { window.__sample = null; }
    for (const col of ['dias', 'anuncios', 'fin', 'meses', 'cfg']) {
      db.collection(col).onSnapshot(snap => {
        const o = {};
        snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
        DB[col] = o; rebuild(); agenda();
      }, () => { /* erro de leitura: mantém o que já havia */ });
    }
    setTimeout(() => { if (!M.carregou) $('#page').innerHTML = vazioHtml('Ainda não há dados no painel', 'Envie as exportações da Shopee e do Mercado Livre no chat e eu carrego aqui.'); }, 6000);
  }
  inicia();
})();

</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Identidade: as três cores da logo da MedService (azul-royal #1835b3, violeta #a066cc, azul-céu #86c7ed) sobre fundo claro e limpo.
   Layout: menu lateral claro com a logo, filtros em painel, KPIs no topo de cada página, gráficos em grade por seções.
   Gráficos: acento azul-royal para uma medida só; Mercado Livre = azul-céu e Shopee = laranja (par validado); status em verde/âmbar/vermelho. */
:root {
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --brand: #1835b3; --brand-2: #a066cc; --brand-3: #86c7ed;
  --bg: #f2f4fb; --surface: #ffffff; --surface-2: #f6f8fd; --ink: #0d1330; --ink-2: #444c70; --muted: #6b7396;
  --line: #e1e6f3; --grid: #e8ecf6; --hover: #eef2fc;
  --accent: #1835b3; --accent-ink: #1835b3; --accent-wash: rgba(24,53,179,.08); --accent-bar: rgba(42,71,208,.22); --chart: #2a47d0; --btn-bg: #1835b3; --btn-ink: #ffffff;
  --side-bg: #ffffff; --side-ink: #4a5278; --side-line: #e6eaf5; --side-hover: #f1f4fc; --side-active: rgba(24,53,179,.09);
  --ml: #2a95d8; --sh: #eb6834; --c3: #12a5a0; --c4: #7b84a8;
  --cat4: #eda100; --cat5: #e87ba4; --cat6: #008300; --cat7: #a066cc; --cat8: #e34948;
  --good: #0ca30c; --good-ink: #0a7a0a; --warn: #fab219; --warn-ink: #8a5a00; --serious: #ec835a; --crit: #d03b3b; --crit-ink: #b42a2a; --info-ink: #2338b8;
  --good-wash: rgba(12,163,12,.10); --warn-wash: rgba(250,178,25,.18); --crit-wash: rgba(208,59,59,.10); --info-wash: rgba(24,53,179,.08);
  --seq-0: #eef1ff; --seq-1: #d5ddff; --seq-2: #b5c3fb; --seq-3: #94a8f4; --seq-4: #7088ea; --seq-5: #4d68dc; --seq-6: #2f4ccb; --seq-7: #1a34a8;
  --hex-bg: linear-gradient(135deg, rgba(134,199,237,.50), rgba(160,102,204,.30));
  --lg-azul: #1835b3; --lg-roxo: #a066cc; --lg-ceu: #86c7ed; --lg-txt: #050816;
  --shadow: 0 1px 2px rgba(20,32,100,.05), 0 10px 28px rgba(20,32,100,.06);
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080d26; --surface: #0f1640; --surface-2: #141c4b; --ink: #eef1ff; --ink-2: #b9c1e3; --muted: #8e97c2;
    --line: #232d66; --grid: #1a2358; --hover: #17214f;
    --accent: #7f98ff; --accent-ink: #a6b7ff; --accent-wash: rgba(127,152,255,.14); --accent-bar: rgba(106,134,245,.34); --chart: #6a86f5; --btn-bg: #7f98ff; --btn-ink: #0a1033;
    --side-bg: #0b1137; --side-ink: #a9b2da; --side-line: #1e2860; --side-hover: #131b4a; --side-active: rgba(127,152,255,.16);
    --ml: #3b8fdc; --sh: #d95926; --c3: #1fa89a; --c4: #8f99c4;
    --cat4: #c98500; --cat5: #d55181; --cat6: #008300; --cat7: #a46bd6; --cat8: #e66767;
    --good: #0ca30c; --good-ink: #46c946; --warn-ink: #f0b73a; --crit: #e0524f; --crit-ink: #f08381; --info-ink: #a6b7ff;
    --good-wash: rgba(12,163,12,.16); --warn-wash: rgba(250,178,25,.16); --crit-wash: rgba(224,82,79,.16); --info-wash: rgba(127,152,255,.16);
    --seq-0: #151d58; --seq-1: #1b2a7c; --seq-2: #23399f; --seq-3: #3351c4; --seq-4: #4c6ae0; --seq-5: #6f88f0; --seq-6: #98abf8; --seq-7: #c4d0ff;
    --hex-bg: linear-gradient(135deg, rgba(134,199,237,.28), rgba(160,102,204,.34));
    --lg-azul: #6f8dff; --lg-roxo: #b585e0; --lg-ceu: #86c7ed; --lg-txt: #f3f5ff;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.30);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080d26; --surface: #0f1640; --surface-2: #141c4b; --ink: #eef1ff; --ink-2: #b9c1e3; --muted: #8e97c2;
  --line: #232d66; --grid: #1a2358; --hover: #17214f;
  --accent: #7f98ff; --accent-ink: #a6b7ff; --accent-wash: rgba(127,152,255,.14); --accent-bar: rgba(106,134,245,.34); --chart: #6a86f5; --btn-bg: #7f98ff; --btn-ink: #0a1033;
  --side-bg: #0b1137; --side-ink: #a9b2da; --side-line: #1e2860; --side-hover: #131b4a; --side-active: rgba(127,152,255,.16);
  --ml: #3b8fdc; --sh: #d95926; --c3: #1fa89a; --c4: #8f99c4;
  --cat4: #c98500; --cat5: #d55181; --cat6: #008300; --cat7: #a46bd6; --cat8: #e66767;
  --good: #0ca30c; --good-ink: #46c946; --warn-ink: #f0b73a; --crit: #e0524f; --crit-ink: #f08381; --info-ink: #a6b7ff;
  --good-wash: rgba(12,163,12,.16); --warn-wash: rgba(250,178,25,.16); --crit-wash: rgba(224,82,79,.16); --info-wash: rgba(127,152,255,.16);
  --seq-0: #151d58; --seq-1: #1b2a7c; --seq-2: #23399f; --seq-3: #3351c4; --seq-4: #4c6ae0; --seq-5: #6f88f0; --seq-6: #98abf8; --seq-7: #c4d0ff;
  --hex-bg: linear-gradient(135deg, rgba(134,199,237,.28), rgba(160,102,204,.34));
  --lg-azul: #6f8dff; --lg-roxo: #b585e0; --lg-ceu: #86c7ed; --lg-txt: #f3f5ff;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.30);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--brand-3); color: #0d1330; }
svg { display: block; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
/* logo (símbolo + palavra em SVG, nas cores da marca; no tema escuro a palavra fica clara e o azul-royal sobe de tom) */
.lg { display: block; overflow: visible; }
.lg-azul { fill: var(--lg-azul); stroke: var(--lg-azul); stroke-width: var(--lg-sw, .6px); stroke-linejoin: round; }
.lg-roxo { fill: var(--lg-roxo); stroke: var(--lg-roxo); stroke-width: var(--lg-sw, .6px); stroke-linejoin: round; }
.lg-ceu { fill: var(--lg-ceu); stroke: var(--lg-ceu); stroke-width: var(--lg-sw, .6px); stroke-linejoin: round; }
.lg-txt { fill: var(--lg-txt); }

/* ------------------------------------------------------------------ estrutura */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side-bg); color: var(--side-ink); border-right: 1px solid var(--side-line); padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 18px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 2px 6px 16px; border-bottom: 1px solid var(--side-line); }
.brand .lg-full { width: 150px; height: auto; aspect-ratio: 339 / 196; }
.brand .lg-hm, .brand .lg-hw { display: none; }
.brand-cap { display: flex; align-items: center; gap: 10px; font-size: 10.5px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.brand-cap::before, .brand-cap::after { content: ''; width: 18px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--brand), var(--brand-2), var(--brand-3)); }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav button { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 12px; background: transparent; color: var(--side-ink); font-weight: 650; font-size: 13.5px; text-align: left; width: 100%; }
.nav button:hover { background: var(--side-hover); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--side-active); color: var(--accent); font-weight: 750; }
.nav button[aria-current="page"]::before { content: ''; position: absolute; left: -16px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); }
.nav .badge { margin-left: auto; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 700; text-align: center; }
.filtros { display: flex; flex-direction: column; gap: 12px; padding: 14px; background: var(--surface-2); border: 1px solid var(--side-line); border-radius: 16px; }
.filtros h2 { margin: 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 800; display: flex; align-items: center; justify-content: space-between; }
.filtros h2 button { border: 0; background: none; color: var(--accent); font-size: 12px; font-weight: 700; text-transform: none; letter-spacing: 0; padding: 0; }
.filtros h2 .f-toggle { color: var(--muted); font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; cursor: default; display: inline-flex; gap: 6px; align-items: center; }
.filtros .chev { display: none; }
.f-body { display: flex; flex-direction: column; gap: 12px; }
.f { display: flex; flex-direction: column; gap: 5px; }
.f label { font-size: 12px; color: var(--ink-2); font-weight: 650; }
.f select, .f input[type="date"] { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; }
.f select:focus, .f input[type="date"]:focus { border-color: var(--accent); }
.f .datas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.side-foot { margin-top: auto; padding: 12px 6px 0; border-top: 1px solid var(--side-line); font-size: 12px; color: var(--muted); display: flex; gap: 9px; align-items: flex-start; }
.side-foot b { color: var(--ink); font-weight: 650; display: block; }
.main { padding: 0 34px 56px; min-width: 0; }
.main::before { content: ''; display: block; height: 4px; margin: 0 -34px 26px; background: linear-gradient(90deg, var(--brand) 0 38%, var(--brand-2) 38% 70%, var(--brand-3) 70% 100%); }
.topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.topo h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.025em; line-height: 1.12; text-wrap: balance; }
.topo p { margin: 6px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 780px; }
.topo-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--good); } .dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); }
.ativos { display: flex; gap: 8px; flex-wrap: wrap; margin: -8px 0 16px; }
.ativos .chip { background: var(--accent-wash); border-color: transparent; color: var(--accent); }
.ativos .chip button { border: 0; background: none; padding: 0; color: var(--accent); display: grid; place-items: center; opacity: .75; }
.ativos .chip button:hover { color: var(--crit); opacity: 1; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 11px 15px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 12px; font-size: 13.5px; }
.banner.warn { background: var(--warn-wash); border-color: rgba(250,178,25,.45); }
.banner.crit { background: var(--crit-wash); border-color: rgba(208,59,59,.4); }
.banner.info { background: var(--info-wash); border-color: rgba(24,53,179,.22); }
.banner .ico { margin-top: 1px; }
.banner b { font-weight: 700; }
/* título de seção: hexágono da marca + linha */
.sec-t { display: flex; align-items: center; gap: 12px; margin: 28px 2px 12px; }
.sec-t:first-child { margin-top: 6px; }
.sec-t h2 { margin: 0; font-size: 11.5px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.sec-t h2::before { content: ''; width: 12px; height: 13px; background: linear-gradient(135deg, var(--brand-3), var(--brand-2) 55%, var(--brand)); clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); flex: none; }
.sec-t span { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sec-t::after { content: ''; flex: 1 1 24px; height: 1px; background: var(--line); }

/* ------------------------------------------------------------------ cartões, KPIs, tabelas */
.grade { display: grid; gap: 16px; margin-bottom: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.grade > * { min-width: 0; }
.s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; } .s3 { grid-column: span 3; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-h > div:first-child { flex: 1 1 220px; min-width: 0; }
.card-h h3 { margin: 0; font-size: 15.5px; font-weight: 750; letter-spacing: -.01em; }
.card-h p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
.card-a { display: flex; gap: 6px; flex: none; flex-wrap: wrap; max-width: 100%; }
.card-a .seg { max-width: 100%; overflow-x: auto; }
.btn-i { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 9px; padding: 5px 9px; font-size: 12px; font-weight: 650; display: inline-flex; align-items: center; gap: 5px; }
.btn-i:hover { background: var(--hover); }
.btn-i[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); border-color: transparent; }
.grafico { width: 100%; min-height: 240px; flex: 1 1 auto; }
.grafico.alto { min-height: 330px; } .grafico.mid { min-height: 420px; } .grafico.xalto { min-height: 500px; } .grafico.baixo { min-height: 190px; flex: none; }
.kpis { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-bottom: 16px; }
.kpis.c3, .kpis.c5, .kpis.c6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 1250px) { .kpis.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1560px) { .kpis.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (min-width: 1700px) { .kpis.c6 { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 5px; min-width: 0; position: relative; }
.kpi-top { display: flex; flex-direction: row-reverse; justify-content: space-between; align-items: flex-start; gap: 9px; color: var(--ink-2); font-size: 12.5px; font-weight: 650; line-height: 1.3; }
.kpi-ic { width: 34px; height: 34px; background: var(--hex-bg); color: var(--accent); display: grid; place-items: center; flex: none; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); }
.kpi-ic .ico { width: 16px; height: 16px; }
.kpi-v { font-size: 26px; font-weight: 800; letter-spacing: -.025em; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi-s { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px 8px; min-height: 30px; flex-wrap: wrap; }
.kpi-s > div { min-width: 0; }
.kpi-s .spark { margin-left: auto; max-width: 100%; }
.kpi-sub { font-size: 12px; color: var(--muted); line-height: 1.35; }
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.delta .ico { width: 11px; height: 11px; stroke-width: 2.6; }
.delta.up { color: var(--good-ink); background: var(--good-wash); } .delta.down { color: var(--crit-ink); background: var(--crit-wash); } .delta.zero { color: var(--muted); background: var(--surface-2); }
.spark { flex: none; }
.hero { background: linear-gradient(125deg, #1835b3 0%, #3a3fc4 50%, #7e48b9 100%); color: #fff; border: 0; overflow: hidden; box-shadow: 0 14px 34px rgba(24,53,179,.28); height: 100%; }
.hero > * { position: relative; }
.hero .partilha { margin-top: auto; }
.hero .kpi-s + .partilha { padding-top: 0; }
.dst { display: grid; margin-top: 12px; }
.dst > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; padding: 9px 2px; border-top: 1px solid var(--line); }
.dst span { color: var(--ink-2); } .dst b { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.hero .hero-wm { position: absolute; right: -40px; top: 46%; width: 250px; height: auto; aspect-ratio: 207 / 119; pointer-events: none; opacity: 1; --lg-azul: rgba(255,255,255,.11); --lg-roxo: rgba(255,255,255,.17); --lg-ceu: rgba(255,255,255,.09); --lg-sw: 0; }
.hero .kpi-top, .hero .kpi-sub { color: rgba(255,255,255,.82); }
.hero .kpi-ic { background: rgba(255,255,255,.18); color: #fff; }
.hero .kpi-v { font-size: 50px; font-weight: 800; letter-spacing: -.03em; margin-top: 8px; }
.hero .delta.up { color: #8af5ac; background: rgba(138,245,172,.16); } .hero .delta.down { color: #ffc2bf; background: rgba(255,194,191,.16); } .hero .delta.zero { color: rgba(255,255,255,.75); background: rgba(255,255,255,.12); }
.partilha { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.partilha div { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 9px 11px; }
.partilha span { display: block; font-size: 11.5px; color: rgba(255,255,255,.78); font-weight: 650; }
.partilha b { font-size: 16px; font-weight: 800; }
.barra-ads { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; }
.barra-ads label { font-weight: 700; color: var(--ink-2); }
.sel { padding: 8px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; max-width: 100%; }
.partilha-k { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.partilha-k div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.partilha-k span { display: block; font-size: 12.5px; color: var(--ink-2); font-weight: 650; }
.partilha-k b { font-size: 24px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
/* foto de brincadeira no cartão do Douglas */
.com-foto { position: relative; }

e R$ 2,6 mil de lucro (margem de 11,3% depois de Ads no grupo B).","acao":"Ver estoque dos kits de seringa e de papel para 9, 10 e 13/10, inscrever os produtos na campanha 10.10 e reforçar os anúncios nesses dias."},{"titulo":"Levar quem compra 10 seringas para o pacote de 30","impacto_mes":2200,"status":"a testar","texto":"Cada pacote de SR05-10 vendido deixa R$ 3,75 de lucro antes de Ads; o de SR05-20 deixa R$ 7,69 e o de SR05-30, R$ 14,64. A taxa fixa da Shopee pesa mais no pacote barato (a taxa total chega a 35% do preço abaixo de R$ 30). Se 10% dos 1.989 pacotes de SR05-10 vendidos no mês migrassem para o de 30, seriam cerca de R$ 2.168 por mês.","acao":"Ajustar o preço relativo das variações de 10, 20 e 30 un. do anúncio de seringa de 0,5 ml e destacar o de 30 un. como melhor custo por unidade."},{"titulo":"Pedir o RBT12 de outubro ao contador","impacto_mes":-1800,"status":"aguardando dados","texto":"O RBT12 usado em setembro foi R$ 250.784 (faixa 2, alíquota efetiva 4,93%). Setembro entrou com R$ 166.804 de faturamento fiscal. Se o RBT12 de outubro passar de R$ 360 mil, a alíquota efetiva vai para cerca de 6,04% (com R$ 400 mil), o que custa uns R$ 1.841 a mais por mês sobre o mesmo faturamento.","acao":"Pedir o RBT12 (outubro/25 a setembro/26) e o faturamento fiscal de outubro. Sem eles o painel estima o imposto como % da receita bruta."},{"titulo":"Escalar os anúncios que têm folga de ROAS","impacto_mes":1600,"status":"a fazer","texto":"24 anúncios gastaram R$ 23.065 com ROAS de 16,3 em média. Nos kits de seringa e de papel o ROAS de equilíbrio (margem do produto antes de Ads) fica entre 4,3 e 6,9, bem abaixo do que eles entregam. A Shopee atribui ao anúncio uma parte grande da venda do produto (nos kits de seringa de 0,5 ml, quase toda), então o ROAS aparece alto. Estimativa: R$ 2.998 a mais de Ads com ROAS incremental de 10 deixam cerca de R$ 1.646 por mês.","acao":"Baixar a meta de ROAS dos kits de seringa e de papel em degraus de 20% por semana e acompanhar a venda total do produto, não só a atribuída ao anúncio. Parar se o ROAS do dia ficar abaixo de 1,5 vez o equilíbrio."},{"titulo":"Conferir a contagem antes de fechar o pacote","impacto_mes":1500,"status":"a fazer","texto":"Na Shopee, \"itens faltando\" (44) e \"não recebeu\" (32) somam 64% dos 118 pedidos com devolução ou reembolso. O mês teve R$ 2.031 de produto perdido e R$ 1.020 de frete reverso nesse canal. Quem mais aparece nos pedidos com devolução: SR05-20 (19), KIT3DESCARPACK (18), SR05-10 (14), KITFEIJOADA-1 (12).","acao":"Foto da contagem no kit de 3 caixas de luva e nos pacotes de seringa de 20 e 30 un. antes de lacrar. Cortar esses reembolsos pela metade poupa cerca de R$ 1.526 por mês."},{"titulo":"Pausar os anúncios com ROAS abaixo de 6","impacto_mes":700,"status":"a fazer","texto":"14 anúncios ativos gastaram R$ 1.888 e geraram R$ 7.808 de GMV (ROAS 4,1). Com margem de 15% eles devolvem R$ 1.171 em lucro antes de Ads, menos que o gasto. A maioria é lançamento recente (suplementos, agulhas, fraldas, gelo) e ainda aprende; o equilíbrio da casa fica entre 6 e 7.","acao":"Pausar quem tiver gasto acima de R$ 100 e ROAS abaixo de 5 e dar 7 dias aos outros. Os primeiros: Kit 3 Carmed Fini Hidratante Labial 10g So (ROAS 4,1); Kit Lavitan A-Z Mulher + Cabelos e Unhas C (ROAS 5,0); Agulha para Caneta de Insulina Uniqmed 4mm (ROAS 4,2)."},{"titulo":"Proteger os itens caros contra \"não recebi\"","impacto_mes":500,"status":"a fazer","texto":"Quando o reembolso sai sem devolver o produto, a perda é o custo todo, e nos itens caros cada caso dói. No mês: SR-05ML-500 (R$ 575 em 1 pedido), A4R10 (R$ 340 em 2 pedidos), DESCA10-2 (R$ 151 em 1 pedido).","acao":"Guardar rastreio, foto do lacre e peso do pacote para esses SKUs e contestar o \"não recebi\" com a prova de entrega. A estimativa considera recuperar metade."},{"titulo":"Confirmar o custo dos produtos novos","impacto_mes":0,"impacto_txt":"R$ 11.731 de receita (2,0%) sem custo confirmado","status":"aguardando dados","texto":"5 SKUs venderam sem custo confirmado no Cadastro: 30KITFEIJOADA (R$ 11.288), A4R2500 (R$ 237), MICROPORE1UNIDADE (R$ 90), LSP-P (R$ 87), LSP-M (R$ 29). Para o lucro não ficar inflado, 0 deles () usam custo provisório de 53,5% da receita (média do grupo MedService em setembro) e os outros usam o custo inferido de um produto igual.","acao":"Passar o custo de UNIQ-4MM32G-100, UNIQ-ACU-2530 e UNIQ-ACU-2540 e confirmar os inferidos (kit Lavitan A-Z + Cabelos e Unhas = R$ 19,60; SERINGASR0,5100 = R$ 115; SERINGASR0,5010 = R$ 11,80; 2CAIXASCATALOGO = R$ 7,20). Eu atualizo o painel na hora."},{"titulo":"Reprecificar ou revisar custo de quem está abaixo de 20%","impacto_mes":0,"impacto_txt":"até R$ 4,5 mil por mês se todos chegassem a 20%","status":"a fazer","texto":"A margem sobre o recebível (antes de Ads) ficou abaixo de 20% em SKUs que somam R$ 4,5 mil por mês de diferença até a meta; sem as panelas são R$ 2,7 mil. Os maiores: KITFEIJOADA-1 (19%), DESCA10-2 (-8%), SERINGA025SR (14%), DESCA10-1 (10%), CML-BR-G (-24%).","acao":"Conferir primeiro os que têm custo desatualizado (fraldas antigas, kits de luva) e depois o preço. A tabela \"Onde falta margem\" lista todos."},{"titulo":"Evitar preço entre R$ 80,00 e R$ 85,60 na Shopee","impacto_mes":0,"impacto_txt":"regra de preço (efeito pequeno hoje)","status":"a fazer","texto":"A taxa da Shopee muda na faixa de R$ 80: de R$ 79,99 para R$ 80,00 a comissão cai de uns 17% para uns 10%, mas a taxa fixa sobe de uns R$ 5 para uns R$ 16. A taxa total passa de uns R$ 19 para uns R$ 25, e o líquido de R$ 79,99 (uns R$ 60,60) só é igualado perto de R$ 85,60. Em setembro isso apareceu em KITDESCAR-3-M e KITDESCAR-3-P (R$ 83,50 a R$ 84,20), 49 un.","acao":"Nos preços novos, ficar em R$ 79,99 ou passar de R$ 86. Esses dois kits de luva podem ir para R$ 79,99: o líquido sobe uns R$ 1,50 por unidade e o preço menor tende a vender mais."}],"pendencias":["Mandar as exportações de outubro (01/10 até o último dia fechado): Me astro (19/10 08h25) mudam o lucro até 18/10 em +R$ 38,4 mil","texto":"Comparando com a cópia anterior da planilha (MedService_copia_08-10): SR05-20 de R$ 23,30 para R$ 13,90 (1329 un., +R$ 12.493); SR05-10 de R$ 11,80 para R$ 7,20 (2562 un., +R$ 11.785); SR05-30 de R$ 34,90 para R$ 20,60 (720 un., +R$ 10.296). A conta usa o custo do Cadastro em todas as unidades vendidas no mês; se o custo novo vale só para compras recentes, parte das unidades saiu de estoque comprado mais caro e o lucro real fica entre o antigo e o novo. Ficaram sem custo na planilha: LAV-CABUNH-2CX (era R$ 18,40; 128 un.), que entram com 53,5% da receita até você preencher. Pela sua regra, SR05-30 usa R$ 20,60 (3 × o custo do produto do kit com 10 (SR05-10) + a embalagem uma vez; a linha do Cadastro está zerada; 720 un.)."},{"tom":"warn","titulo":"Ads 2,4 vezes maior; cada R$ 1 a mais rendeu R$ 7,6 de GMV","texto":"O gasto foi de R$ 758 para R$ 1.802 por dia (01 a 25/09 contra agora) e o GMV atribuído de R$ 13.134 para R$ 21.030. O equilíbrio da casa fica entre 6 e 7: o gasto a mais empata com o que custa, e não sobra lucro nele."},{"tom":"warn","titulo":"Onde está pior que em setembro","texto":"Ads em 8,2% da receita (setembro 6,1%); ticket médio de R$ 37,85 (setembro R$ 47,55)."},{"tom":"warn","titulo":"Despesas e juros de R$ 27,4 mil no mês (projeção)","texto":"Pagos até 18/10: R$ 21,4 mil (aluguel R$ 7.280, freelancers R$ 4.900, frete R$ 3.073, juros R$ 5.000). O resultado até agora (R$ 50,8 mil) já desconta esse valor; a projeção soma o ritmo de freelancers, frete e sistema até o fim do mês."},{"tom":"warn","titulo":"8,1% da receita sem custo confirmado","texto":"30 SKUs novos (suplementos, agulhas, seringas do ML) estão com custo inferido ou provisório. Confirme os custos e o lucro de outubro fica firme."}],"sugestoes":[{"titulo":"Levar quem compra 10 seringas para o pacote de 30","impacto_mes":9900,"status":"a testar","texto":"Cada pacote de SR05-10 vendido deixa R$ 7,82 de lucro antes de Ads; o de SR05-20 deixa R$ 17,65 e o de SR05-30, R$ 30,21. A taxa fixa da Shopee pesa mais no pacote barato (a taxa total chega a 35% do preço abaixo de R$ 30). Se 10% dos 4.412 pacotes de SR05-10 vendidos no mês (no ritmo atual) migrassem para o de 30, seriam cerca de R$ 9.880 por mês.","acao":"Ajustar o preço relativo das variações de 10, 20 e 30 un. do anúncio de seringa de 0,5 ml e destacar o de 30 un. como melhor custo por unidade."},{"titulo":"Escalar o anúncio principal de seringa","impacto_mes":8900,"status":"a fazer","texto":"O anúncio \"Seringa P/ Insulina e Botox 0,5ml 50UI Agulha 6x0,25 31G SR \" subiu de R$ 346 para R$ 692 de gasto por dia, e o GMV atribuído foi de R$ 6.145 para R$ 8.926 por dia: cada R$ 1 a mais rendeu cerca de R$ 8,0 de GMV (ROAS marginal), contra ROAS médio de 12,9 agora e 17,7 antes. O equilíbrio dele é 2,6 (margem do produto antes de Ads). No conjunto dos anúncios o gasto foi de R$ 758 para R$ 1.802 por dia e o GMV atribuído de R$ 13.134 para R$ 21.030: ROAS marginal de 7,6, perto do equilíbrio da casa (6 a 7). É um indício, não uma medida exata: o GMV atribuído mistura venda que viria sem anúncio. Estimativa: R$ 4.293 a mais de gasto no mês (20%) com esse retorno marginal deixam cerca de R$ 8.854.","acao":"Baixar a meta de ROAS em degraus de 20% por semana e acompanhar a venda total do produto."},{"titulo":"Conferir o frete dos kits pesados na Shopee","impacto_mes":2200,"status":"a fazer","texto":"Comparei o que a Shopee depositou (relatório de carteira) com o líquido do relatório de pedidos em 2.127 pedidos de setembro liberados em outubro: bate no centavo em 82% deles e o total fica R$ 805 (1,25%) abaixo. A diferença está no frete dos kits grandes, que passa do estimado: A4R10 perdeu 9,5% do líquido em 14 pedidos (R$ 318), e os pedidos acima de R$ 250 perderam 8,3%. Em outubro há 111 pedidos acima de R$ 150 (R$ 28.622 de receita); no ritmo atual isso custa uns R$ 2.200 por mês a mais do que o painel mostra (somando todos os pedidos, uns R$ 3.771 por mês).","acao":"Conferir peso e medidas declarados dos kits de 10 resmas de papel e dos kits grandes de luva (a Shopee cobra o frete pelo peso real) e repassar o frete no preço. O painel não desconta esse ajuste do resultado; se quiser, passo a descontar."},{"titulo":"Conferir a contagem antes de fechar o pacote","impacto_mes":2000,"status":"a fazer","texto":"Na Shopee, \"itens faltando\" (24) e \"não recebeu\" (14) somam 11% dos 343 pedidos com devolução ou reembolso. O produto não se perde (vocês reenviam), mas cada caso custa frete e retrabalho: R$ 2.340 de frete reverso nesse canal no mês. Quem mais aparece nos pedidos com devolução: SR1ML1345-K30 (139), SR1ML1345-K20 (74), SR1ML1345-K10 (64), SR05-10 (10).","acao":"Foto da contagem no kit de 3 caixas de luva e nos pacotes de seringa de 20 e 30 un. antes de lacrar. Cortar esses reembolsos pela metade poupa cerca de R$ 2.015 por mês."},{"titulo":"Pedir o RBT12 de outubro ao contador","impacto_mes":-1800,"status":"aguardando dados","texto":"O RBT12 usado em setembro foi R$ 250.784 (faixa 2, alíquota efetiva 4,93%). Setembro entrou com R$ 166.804 de faturamento fiscal. Se o RBT12 de outubro passar de R$ 360 mil, a alíquota efetiva vai para cerca de 6,04% (com R$ 400 mil), o que custa uns R$ 1.841 a mais por mês sobre o mesmo faturamento.","acao":"Pedir o RBT12 (outubro/25 a setembro/26) e o faturamento fiscal de outubro. Sem eles o painel estima o imposto como % da receita bruta."},{"titulo":"Pausar os anúncios com ROAS abaixo de 6","impacto_mes":500,"status":"a fazer","texto":"4 anúncios ativos gastaram R$ 970 (cerca de R$ 1.648 por mês no ritmo atual) e geraram R$ 4.404 de GMV (ROAS 4,5). Com margem de 15% eles devolvem R$ 661 em lucro antes de Ads, menos que o gasto. A maioria é lançamento recente (suplementos, agulhas, fraldas, gelo) e ainda aprende; o equilíbrio da casa fica entre 6 e 7.","acao":"Pausar quem tiver gasto acima de R$ 100 e ROAS abaixo de 5 e dar 7 dias aos outros. Os primeiros: Kit 3 Carmed Fini Hidratante Labial 10g So (ROAS 4,8); Kit 3 Caixas Melatonina Lavitan Cimed 270  (ROAS 3,8); Kit 10 Caixas Luva de Procedimento com Pó  (ROAS 5,6)."},{"titulo":"Confirmar o custo dos produtos novos","impacto_mes":0,"impacto_txt":"R$ 33.379 de receita (8,1%) sem custo confirmado","status":"aguardando dados","texto":"30 SKUs venderam sem custo confirmado no Cadastro: LAV-CABUNH-2CX (R$ 4.478), (sem SKU) (R$ 4.389), UNIQ-4MM32G-100 (R$ 3.522), LAV-AZM-CU-K2 (R$ 2.764), SERINGASR0,5100 (R$ 2.620), KITLAVITANUNHASEDEAZ (R$ 2.293). Para o lucro não ficar inflado, 23 deles (LAV-CABUNH-2CX, (sem SKU), UNIQ-4MM32G-100, KIT10013X45-1ML) usam custo provisório de 53,5% da receita (média do grupo MedService em setembro) e os outros usam o custo inferido de um produto igual.","acao":"Passar o custo de LAV-CABUNH-2CX, (sem SKU), UNIQ-4MM32G-100, KIT10013X45-1ML, UNIQ-ACU-2530, SER03-K10, SR-1ML-8X030-K20, KIT5-CARMED e confirmar os inferidos (LAV-AZM-CU-K2 = R$ 19,60; SERINGASR0,5100 = R$ 68,20; KITLAVITANUNHASEDEAZ = R$ 19,60). Eu atualizo o painel na hora."},{"titulo":"Conferir as despesas de outubro","impacto_mes":0,"impacto_txt":"já no resultado: R$ 21,4 mil até 18/10; R$ 27,4 mil na projeção do mês","status":"aguardando dados","texto":"A aba Despesas tem 51 lançamentos até 17/10. Saem do lucro R$ 21,4 mil: aluguel R$ 7.280, freelancers R$ 4.900, frete de compras R$ 3.073, juros do empréstimo R$ 5.000, contador R$ 810 e sistema R$ 329. Ficam fora: insumos R$ 1.377 (já estão no custo da embalagem), compras de mercadoria (R$ 143,8 mil), retiradas (R$ 23,0 mil) e devolução ou abatimento de empréstimo (R$ 13.000).","acao":"Lançar cada pagamento na aba Despesas (os juros com a palavra \"juros\" na descrição). Confirmar se os R$ 7.280 de aluguel se repetem todo mês. A projeção conta aluguel, contador e juros uma vez e o resto no ritmo do mês."},{"titulo":"Reprecificar ou revisar custo de quem está abaixo de 20%","impacto_mes":0,"impacto_txt":"até R$ 3,6 mil por mês (no ritmo atual) se todos chegassem a 20%","status":"a fazer","texto":"A margem sobre o recebível (antes de Ads) ficou abaixo de 20% em SKUs que somam R$ 3,6 mil por mês (no ritmo atual) de diferença até a meta. Os maiores: KIT10013X45-1ML (-25%), (sem SKU) (6%), KITLAVITANUNHASEDEAZ (9%), UNIQ-4MM32G-100 (14%), CF2-DEN (15%).","acao":"Conferir primeiro os que têm custo desatualizado (fraldas antigas, kits de luva) e depois o preço. A tabela \"Onde falta margem\" lista todos."},{"titulo":"Evitar preço entre R$ 80,00 e R$ 85,60 na Shopee","impacto_mes":0,"impacto_txt":"regra de preço (efeito pequeno hoje)","status":"a fazer","texto":"A taxa da Shopee muda na faixa de R$ 80: de R$ 79,99 para R$ 80,00 a comissão cai de uns 17% para uns 10%, mas a taxa fixa sobe de uns R$ 5 para uns R$ 16. A taxa total passa de uns R$ 19 para uns R$ 25, e o líquido de R$ 79,99 (uns R$ 60,60) só é igualado perto de R$ 85,60. Em setembro isso apareceu em KITDESCAR-3-M e KITDESCAR-3-P (R$ 83,50 a R$ 84,20), 49 un.","acao":"Nos preços novos, ficar em R$ 79,99 ou passar de R$ 86. Esses dois kits de luva podem ir para R$ 79,99: o líquido sobe uns R$ 1,50 por unidade e o preço menor tende a vender mais."}],"pendencias":["Próximo parcial (sugestão: 21 ou 22/10): mandar de novo o Mercado Livre \"Vendas BR\" (a última é de 19/10 às 06h21), o Shopee Order.all (a aba Todos, não a A enviar), o Order.return_refund_cancel, o Dados Gerais de Anúncios, o extrato diário de anúncios e o relatório de carteira.","Embalagem (insumo) não incluída no custo: 7 SKUs vendidos, 1.187 un. e R$ 30.599 de receita (os maiores: SR1ML1345-K30, SR1ML1345-K10, SR1ML1345-K20, 1CAIXA, 3CAIXAS, LAV-AZMUL-60). Com R$ 0,50 por unidade, como nos outros, seriam uns R$ 594 a mais de insumos no período. Os kits SR1ML1345 entraram só com o custo do fornecedor e ainda não estão no Cadastro: preencha \"Custo embalagem\" lá ou me diga o valor.","SR05-30: a linha do Cadastro está zerada e uso R$ 20,60 pela sua regra (3 × o custo do produto do kit com 10 (SR05-10) + a embalagem uma vez). Quando a planilha for preenchida, passa a valer o valor dela.","Gasto do ML Ads de outubro (print do painel do ML): hoje estimado pela proporção de setembro.","Custos sem cadastro (hoje 53,5% da receita): LAV-CABUNH-2CX, (sem SKU), UNIQ-4MM32G-100, KIT10013X45-1ML, UNIQ-ACU-2530, SER03-K10, SR-1ML-8X030-K20, KIT5-CARMED, KIT20013X45-1ML, SR-1ML-8X030-K30, UNIQ-ACU-2540, KIT2MELATONINA-MARA, MELATONINA-MARA, SR-1ML-8X030-K10, KIT2MELATONINA-MORAN, SER03-K20, XOIN-CIM-200, KIT5MELATONINA-MORAN, MELATONINA-MORAN, CARM-SORV-K3, KIT3MELATONINA-MARA, KMIS-CIM-8UN, KIT5MELATONINA-MARA. Confirmar também os inferidos: LAV-AZM-CU-K2 R$ 19,60; SERINGASR0,5100 R$ 68,20; KITLAVITANUNHASEDEAZ R$ 19,60.","RBT12 de outubro e faturamento fiscal do mês (contador): o imposto está estimado em 1,42% da receita bruta, a razão de setembro.","Frete dos kits pesados da Shopee: decidir se o painel e o fechamento passam a descontar o ajuste calibrado pela carteira (R$ 2.190 no período, uns R$ 3.771 no mês). Hoje não entra no resultado.","Devoluções de pedidos de setembro: 21 pedidos tiveram devolução ou reembolso pedido em outubro (R$ 832,37 a reembolsar), fora do fechamento de setembro. Descontar do lucro de outubro?","TikTok: R$ 4,8 mil de lucro de setembro retidos. O prazo do recurso era 11/10, 18:44: me diga se houve resposta. Shopee: recurso dos 2 pontos de penalidade até 19/10."],"notas":"Parcial de 01/10 a 18/10 na Shopee. 19/10 estava em andamento na Shopee (até 05h59) e fica fora das médias e dos totais. Receita bruta = só vendas efetivadas, nos dois canais. Panelas fora do painel (não são mais vendidas; o que sobrou delas em 01/10 entra como MedService); setembro aparece só com o grupo MedService para comparar. Distribuição de outubro: 35% João e 65% Douglas sobre todo o lucro, inclusive o imposto, por decisão sua (em setembro o imposto saía do grupo das panelas, 40/60). Custos: lidos do Cadastro da planilha compartilhada salvo em 19/10 08h25 (a coluna \"Custo un.\" das tabelas de produtos mostra o custo usado em cada SKU). Insumos (embalagens): R$ 4.594 no período, a coluna \"Custo embalagem\" do Cadastro vezes as unidades vendidas; já fazem parte do custo total do Cadastro e o DRE mostra à parte (7 SKUs vendidos ainda sem embalagem preenchida). SKUs sem custo no Cadastro usam custo inferido de um produto igual ou provisório de 53,5% da receita. O ML Ads é estimado pela proporção de setembro. O frete real dos kits pesados da Shopee passa do estimado no relatório de pedidos; o painel não desconta esse ajuste (ver sugestões). Carteira da Shopee (01/10 a 19/10, até 18/10 08h40): liberou R$ 145.365 em 5.238 pedidos (quase todos de setembro), saque de R$ 128.208, saldo de R$ 33.685; R$ 277 de ICMS DIFAL (46 débitos de pedidos de agosto) e R$ 770 de reembolsos por objeto perdido ficam fora do resultado (é caixa, não lucro). A projeção usa os mesmos % de Ads e margens do período; com poucos dias de dados ela varia muito (em setembro, a projeção linear errou entre +16% e +40%). Cálculo: gasto de Ads da Shopee de 01 a 18/10 pelo extrato diário de anúncios (R$ 32.815,01); gasto de ML Ads estimado pela proporção de setembro (informe o valor do painel do ML para usar o real).","contexto":"MedService vende material médico-hospitalar e papel no Mercado Livre e na Shopee; as panelas não são mais vendidas e o TikTok está restrito (fora da divisão). Em outubro o lucro a distribuir (depois do imposto estimado) divide 35% João / 65% Douglas, com fundo de caixa de 20%. As despesas operacionais de outubro ficam fora da conta a pedido do usuário; os insumos (embalagens) são descontados pelo custo de embalagem do Cadastro. Produto devolvido volta ao estoque; o custo é o frete reverso (ML: o que o ML cobra; Shopee: R$ 15 por pedido). Na Shopee há um recurso de 2 pontos de penalidade por resposta a avaliação."}}}</script>

    `<polyline pathLength="1" points="${pts.join(' ')}" style="fill:none;stroke:${col};stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>` +

/* =================================================================================================== animações de entrada (lentas e acompanhando a rolagem)
   Cada cartão, gráfico e número só anima quando entra na tela: os números contam a partir do zero, as barras e linhas crescem
   devagar, as barras de HTML e as minilinhas se desenham. O que ainda está abaixo da tela fica parado no zero até você rolar até ele.
   Quem pede "reduzir movimento" no sistema vê tudo parado. Um re-desenho da mesma página logo em seguida não repete a animação. */
const ANIM = { ok: !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), agora: false, sig: null, t: 0,

const fmtBR = (v, nd, grupo) => v.toLocaleString('pt-BR', { minimumFractionDigits: nd, maximumFractionDigits: nd, useGrouping: grupo });
function animaNumeros(raiz) {
  if (!ANIM.agora || !raiz) return;
  const porBloco = new Map();
  raiz.querySelectorAll('.kpi-v, .partilha b, .partilha-k b, .linha-mes .vl, .bigline b, .canal-l .big, .canal-l .mini b').forEach(el => {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let no = null, m = null, n;
    while ((n = w.nextNode())) {
      const s = n.nodeValue || '';

      m = s.match(/(\d{1,3}(?:\.\d{3})+|\d+)(,\d+)?/);
      if (m) { no = n; break; }
    }
    if (!no) return;

    const nd = m[2] ? m[2].length - 1 : 0, grupo = m[1].indexOf('.') >= 0;
    const alvo = parseFloat(m[1].replace(/\./g, '') + (m[2] ? '.' + m[2].slice(1) : ''));

function escolheSnapshot(lista, p) {
  if (!lista.length) return null;
  const ids = lista.map(x => x.id);
  if (ADS.snap && ids.includes(ADS.snap)) return lista[ids.indexOf(ADS.snap)];
  const ate = lista.filter(x => x.ate <= p.ate);
  return ate.length ? ate[ate.length - 1] : lista[0];
}
function marginais(sel, lista) {                     // ROAS dos últimos dias: diferença entre o relatório escolhido e o anterior (mesmo início de período)
  const ant = lista.filter(x => x.de === sel.de && x.ate < sel.ate).pop();
  const m = new Map(); if (!ant) return { ant: null, m };
  const prev = new Map(ant.itens.map(x => [x.id, x]));
  for (const x of sel.itens) {
    const a = prev.get(x.id), g = x.gasto - (a ? a.gasto : 0), v = x.gmv - (a ? a.gmv : 0);
    if (g >= 20) m.set(x.id, { g, v, roas: v / g });

  return { ant, m };
}

const lojaNomeFonte = s => ({ 'GMV Máximo Personalizado de Anúncios ROAS': 'Anúncios GMV Max (meta de ROAS)', 'GMV Máximo do Produto em Anúncios com Lances Automáticos': 'Anúncios GMV Max (lance automático)',

REG.prod = function (el, { p, cm, f }) {
  const alvo = M.geral.margem_alvo != null ? M.geral.margem_alvo : 0.2, dias = rangeD(p.de, p.ate);
  const sk0 = porSku(p.de, p.ate, f).filter(o => o.un > 0 || o.bruta !== 0);
  for (const o of sk0) o.devPct = o.un > 0 ? o.devun / o.un : null;
  const total = sk0.length, semCusto = sk0.filter(o => o.flag === 'missing'), abaixo = sk0.filter(o => o.margem != null && o.margem < alvo && o.flag !== 'missing'), comDev = sk0.filter(o => o.devun > 0);
  const maxB = Math.max(1, ...sk0.map(o => o.bruta));
  const sits = [['todos', 'Todos'], ['abaixo', 'Abaixo da meta'], ['semcusto', 'Sem custo'], ['dev', 'Canc. ou devolução']];
  const lista = () => {
    let v = sk0.slice(); const q = PROD.q.trim().toLowerCase();
    if (q) v = v.filter(o => (o.sku + ' ' + (o.nome || '') + ' ' + (o.marca || '')).toLowerCase().includes(q));
    if (PROD.sit === 'abaixo') v = abaixo.filter(o => v.includes(o)); else if (PROD.sit === 'semcusto') v = v.filter(o => o.flag === 'missing'); else if (PROD.sit === 'dev') v = v.filter(o => o.devun > 0);
    const k = PROD.ord, dir = PROD.dir;
    v.sort((a, b) => { const x = a[k], y = b[k]; if (k === 'sku') return dir * String(x).localeCompare(String(y), 'pt-BR'); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return dir * (x - y); });
    return v;
  };
  const tabela = () => {
    const v = lista(), mostra = PROD.todos ? v : v.slice(0, 40);
    if (!v.length) return vazioHtml('Nenhum produto encontrado', 'Ajuste a busca ou o filtro de situação.');
    const th = PCOLS.map(c => c.k ? `<th class="${c.v ? 'v' : ''}" aria-sort="${PROD.ord === c.k ? (PROD.dir < 0 ? 'descending' : 'ascending') : 'none'}"><button type="button" data-o="${c.k}">${esc(c.t)}${PROD.ord === c.k ? (PROD.dir < 0 ? ' ↓' : ' ↑') : ''}</button></th>` : `<th>${esc(c.t)}</th>`).join('');
    const linhas = mostra.map(o => `<tr class="clic" data-k="${esc(o.sku)}" tabindex="0"><td><span class="sku">${esc(o.sku)}</span>${o.flag === 'missing' ? ' <span class="pill warn">sem custo</span>' : ''}<br><span class="meta">${esc((o.nome || '').length > 58 ? o.nome.slice(0, 56) + '…' : (o.nome || ''))}</span></td>` +
      `<td class="v"><span class="barra"><i style="width:${Math.max(2, o.bruta / maxB * 100).toFixed(0)}%"></i><span>${brl(o.bruta)}</span></span></td><td class="v">${num(o.un)}</td><td class="v">${brl(o.preco, 2)}</td><td class="v">${brl(o.cuUn, 2)}</td>` +
      `<td class="v"><span class="pill ${faixaMargem(o.margem, alvo)}">${pct(o.margem)}</span></td><td class="v">${cel(o.lucro)}</td><td class="v">${o.devun > 0 ? `${num(o.devun)} <span class="meta">(${pct(o.devPct, 0)})</span>` : '<span class="meta">–</span>'}</td><td>${sparkSvg(dias.map(d => o.dias[d] || 0), { w: 84, h: 26 })}</td></tr>`).join('');
    return `<div class="tw"><table class="t"><thead><tr>${th}</tr></thead><tbody>${linhas}</tbody></table></div>` +
      `<div class="rod-tab"><span class="meta">${mostra.length} de ${v.length} produtos${v.length < total ? ` (${total} no período)` : ''}. Margem = lucro antes de Ads ÷ receita líquida recebida.</span>${v.length > 40 ? `<button type="button" class="btn-i" id="prod-mais">${PROD.todos ? 'Mostrar só os 40 primeiros' : `Mostrar todos os ${v.length}`}</button>` : ''}</div>`;
  };
  const kp = [
    kpiHtml({ ic: 'box', label: 'Produtos vendidos', valor: num(total), sub: `${num(sum(sk0, o => o.un))} unidades no período` }),
    kpiHtml({ ic: 'target', label: 'Abaixo da meta', valor: num(abaixo.length), sub: `margem menor que ${pct(alvo, 0)} do recebível` }),
    kpiHtml({ ic: 'alert', label: 'Sem custo cadastrado', valor: num(semCusto.length), sub: semCusto.length ? `${brl(sum(semCusto, o => o.bruta))} de receita com custo provisório` : 'todos com custo' }),
    kpiHtml({ ic: 'undo', label: 'Com cancelamento ou devolução', valor: num(comDev.length), sub: `${num(sum(comDev, o => o.devun))} unidades de pedidos cancelados ou devolvidos` })
  ];
  el.innerHTML = `${secao('Resumo dos produtos', `${dd(p.de)} a ${dd(p.ate)}`)}${kpiRow(kp)}
    ${secao('Todos os produtos', 'clique em uma linha para ver o detalhe')}
    <section class="card"><div class="busca"><input type="search" id="prod-q" placeholder="Buscar por SKU, nome ou marca" aria-label="Buscar produto" value="${esc(PROD.q)}"><div class="seg" role="group" aria-label="Situação">${sits.map(([k, t]) => `<button type="button" data-sit="${k}" aria-pressed="${PROD.sit === k}">${esc(t)}</button>`).join('')}</div></div>
      <div id="prod-tab">${tabela()}</div></section>`;
  const liga = () => {
    $$('#prod-tab [data-o]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.o; if (PROD.ord === k) PROD.dir = -PROD.dir; else { PROD.ord = k; PROD.dir = k === 'sku' ? 1 : -1; } atualiza(); }));

  liga();
};

function chDevDia(t, dias, ult) {
  const cats = dias.map(x => x.d), parc = x => x.ok.SH === 'parcial' || x.ok.ML === 'parcial';
  const eixoX = (i, mostra) => axX(t, cats, { gridIndex: i, axisLabel: { show: mostra, color: t.muted, fontSize: 11.5, hideOverlap: true, formatter: v => dd(v) }, axisPointer: { label: { show: false } } });
  const tit = (txt, top) => ({ text: txt, left: 4, top, textStyle: { color: t.muted, fontSize: 11.5, fontWeight: 600, fontFamily: t.font } });
  const area = ult && ult.length ? { silent: true, itemStyle: { color: t.muted, opacity: .10 }, data: [[{ xAxis: ult[0] }, { xAxis: ult[ult.length - 1] }]] } : undefined;
  const pctOf = (n, x) => x.pedT > 0 ? n / x.pedT * 100 : null;
  return {
    textStyle: { fontFamily: t.font }, animationDuration: 350, axisPointer: { link: [{ xAxisIndex: 'all' }] },
    legend: legendBase(t, { data: ['Devoluções', 'Cancelamentos'] }),
    tooltip: tooltipBase(t, ps => {
      const x = dias[ps[0].dataIndex]; if (!x) return '';
      return tipLinhas(t, cap(diaLongo(x.d)), [{ nome: 'Devoluções', cor: t.cat8, valor: num(x.ped_dev) + ' · ' + pct(x.devPct) }, { nome: 'Cancelamentos', cor: t.c4, valor: num(x.ped_canc) + ' · ' + pct(x.cancPct) }, { nome: 'Pedidos criados', cor: t.muted, valor: num(x.pedT) }],
        (ult && ult.includes(x.d) ? 'Dia recente: ainda pode receber devoluções. ' : '') + (parc(x) ? 'Dia em andamento.' : ''));
    }),
    title: [tit('Pedidos por dia', 28), tit('Parte dos pedidos criados no dia', 268)],
    grid: [gridBase({ top: 54, height: 180 }), gridBase({ top: 296, height: 90, bottom: 28 })],
    xAxis: [eixoX(0, false), eixoX(1, true)],
    yAxis: [axY(t, { gridIndex: 0, minInterval: 1, axisLabel: { color: t.muted, fontSize: 11.5, formatter: v => num(v) } }), axY(t, { gridIndex: 1, splitNumber: 2, axisLabel: { color: t.muted, fontSize: 11.5, formatter: v => NF[1].format(v) + '%' } })],
    series: [
      barraBase(t, t.cat8, { name: 'Devoluções', stack: 'd', xAxisIndex: 0, yAxisIndex: 0, data: dias.map(x => ({ value: x.pedT > 0 ? x.ped_dev : null, itemStyle: { opacity: parc(x) ? .5 : 1 } })), itemStyle: { color: t.cat8, borderRadius: 0, borderColor: t.surface, borderWidth: 1.5 }, markArea: area }),
      barraBase(t, t.c4, { name: 'Cancelamentos', stack: 'd', xAxisIndex: 0, yAxisIndex: 0, data: dias.map(x => ({ value: x.pedT > 0 ? x.ped_canc : null, itemStyle: { opacity: parc(x) ? .5 : 1 } })) }),
      { type: 'line', name: 'Devoluções', xAxisIndex: 1, yAxisIndex: 1, data: dias.map(x => x.pedT > 0 ? +(pctOf(x.ped_dev, x) || 0).toFixed(2) : null), showSymbol: true, symbolSize: 6, lineStyle: { width: 2, color: t.cat8 }, itemStyle: { color: t.cat8, borderColor: t.surface, borderWidth: 2 } },
      { type: 'line', name: 'Cancelamentos', xAxisIndex: 1, yAxisIndex: 1, data: dias.map(x => x.pedT > 0 ? +(pctOf(x.ped_canc, x) || 0).toFixed(2) : null), showSymbol: true, symbolSize: 6, lineStyle: { width: 2, color: t.c4 }, itemStyle: { color: t.c4, borderColor: t.surface, borderWidth: 2 } }
    ]
  };
}

function carteiraDias(p) {                      // dias da carteira dentro do período, com os dias sem movimento preenchidos (o saldo segue o do dia anterior)
  const w = DB.fin.carteira; if (!w || !w.dias || !w.dias.length) return null;
  const de = p.de > w.de ? p.de : w.de, ate = p.ate < w.ate ? p.ate : w.ate;
  if (de > ate) return null;
  const idx = {}; for (const x of w.dias) idx[x.d] = x;
  let saldo = null; for (const x of w.dias) { if (x.d < de) saldo = x.saldo; }
  return { w, de, ate, dias: rangeD(de, ate).map(d => { const x = idx[d]; if (x) { saldo = x.saldo; return Object.assign({ mov: true }, x); } return { d, lib: 0, n_lib: 0, saque: 0, difal: 0, n_difal: 0, outros: 0, saldo, mov: false }; }) };
}

/* =================================================================================================== DESPESAS: o que sai do lucro (aba Despesas da planilha), empréstimo e o que fica de fora
   Fonte: doc do mês (meses/AAAA-MM, campo despesas.itens, gerado por painel_medservice.py a partir da aba Despesas) e fin/balanco (empréstimos).
   Saem do lucro: tipo "Despesa" (operacionais) e os juros do empréstimo. Ficam fora: insumos e imposto (já contados em outro lugar),
   compras de mercadoria (o custo entra quando o produto vende), retiradas dos sócios e devolução ou abatimento de empréstimo. */
const DP_CONTA = { op: 'sai do lucro', juros: 'sai do lucro', fora: 'já contado', cmv: 'compra', ret: 'retirada', naoop: 'empréstimo' };
const DP_TOM = { op: 'warn', juros: 'warn', fora: 'mute', cmv: 'mute', ret: 'info', naoop: 'mute' };
const dpConta = x => x.tipo === 'Despesa' ? (x.cat === 'Juros do empréstimo' ? 'juros' : 'op') : x.tipo === 'Fora' ? 'fora' : x.tipo === 'CMV' ? 'cmv' : x.tipo === 'Retirada' ? 'ret' : 'naoop';
function despesasDoMes(m) { const md = mesDoc(m), dp = md && !md.sem_opex && md.despesas; return dp && Array.isArray(dp.itens) ? dp : null; }
function despesasEm(de, ate) {            // pelo dia do pagamento; só meses em que a aba Despesas entra na conta
  const dp = despesasDoMes(monthOf(ate));
  if (!dp) return null;
  const its = dp.itens.filter(x => x.d >= de && x.d <= ate), sai = its.filter(x => x.tipo === 'Despesa');
  return { dp, its, op: sum(sai.filter(x => dpConta(x) === 'op'), x => x.v), juros: sum(sai.filter(x => dpConta(x) === 'juros'), x => x.v), total: sum(sai, x => x.v), n: sai.length };
}
const emprestimo = () => ((DB.fin.balanco || {}).emprestimos || [])[0] || null;

function chDespCat(t, L, tot) {

/* simulação do empréstimo: juros de cada mês pagando só os juros ou abatendo um valor fixo por mês */

/* =================================================================================================== RESERVAS: fundo de caixa de cada sócio e imposto reservado (doc fin/reservas) */
const RS_MES3 = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
const rsMes = m => RS_MES3[+m.slice(5, 7) - 1] + '/' + m.slice(2, 4);
const rsMesLongo = m => cap(MESES[+m.slice(5, 7) - 1]);
const RS_TONS = ['good', 'warn', 'crit', 'info', 'mute'];

function reservasCalc() {
  const R = DB.fin.reservas;
  if (!R || !Array.isArray(R.meses) || !R.meses.length) return null;
  const U = R.usos || {}, uf = U.fundo || [], ui = U.imposto || [];
  let aj = 0, ad = 0, ai = 0;
  const linhas = R.meses.map(m => {
    const f = m.fundo || {};
    const rj = sum(uf.filter(u => u.mes === m.mes), u => u.joao || 0), rd = sum(uf.filter(u => u.mes === m.mes), u => u.douglas || 0), pg = sum(ui.filter(u => u.mes === m.mes), u => u.valor || 0);
    aj += (f.joao || 0) - rj; ad += (f.douglas || 0) - rd; ai += (m.imposto || 0) - pg;
    return Object.assign({}, m, { fj: f.joao || 0, fd: f.douglas || 0, imp: m.imposto || 0, aj, ad, ai });
  });
  const ult = linhas[linhas.length - 1], ant = linhas.length > 1 ? linhas[linhas.length - 2] : { aj: 0, ad: 0, ai: 0 };
  // projeção: acumulado até o mês anterior − o que já saiu neste mês (retiradas do fundo, imposto pago) + o que o mês deve guardar até o fim
  const pj = ult.projecao && ult.projecao.fundo ? { aj: ult.aj - ult.fj + (ult.projecao.fundo.joao || 0), ad: ult.ad - ult.fd + (ult.projecao.fundo.douglas || 0), ai: ult.ai - ult.imp + (ult.projecao.imposto || 0), ate: ult.projecao.ate || '' } : null;
  return { R, linhas, ult, pj, pagos: sum(ui, u => u.valor || 0) };
}

function chReservas(t, c) {
  const cats = c.linhas.map(x => rsMes(x.mes) + (x.estado === 'parcial' ? '\naté ' + x.ate : ''));          // duas linhas: cabem no celular
  const dj = c.linhas.map(x => x.aj), dd2 = c.linhas.map(x => x.ad), di = c.linhas.map(x => x.ai);
  if (c.pj) { cats.push('Projeção\n' + c.pj.ate); dj.push(c.pj.aj); dd2.push(c.pj.ad); di.push(c.pj.ai); }
  const proj = i => !!c.pj && i === cats.length - 1;
  const ponto = (v, i) => ({ value: v, itemStyle: proj(i) ? { opacity: .45 } : {} });

/* =================================================================================================== MÊS E PROJEÇÃO */
const MES = { atual: null, sim: null, simMes: null, ctl: null, aiHtml: '', aiStatus: '' };
const brlMil = v => ok(v) ? (v < 0 ? '−R$ ' : 'R$ ') + NF[1].format(Math.abs(v) / 1000) + ' mil' : '–';
const RITMO_NOME = { media: 'média do mês', ult7: 'últimos 7 dias', ult3: 'últimos 3 dias' };

/* mesmas fórmulas do fechamento (sem despesas operacionais quando o mês as deixa de fora: fixos_ambos = 0) */
function projetaMes(P, s) {
  const dias = P.dias_mes, fatA = s.vA * dias, fatB = s.vB * dias;
  const lopA = fatA * (P.mc_A + s.mc - P.ads_pct_A), lopB = fatB * (P.mc_B + s.mc - s.adsB);
  const impPctX = s.f3 ? (P.imposto_pct_f3 || P.imposto_pct) : P.imposto_pct, imposto = impPctX * (fatA + fatB), ambos = P.fixos_ambos + imposto, baseA = lopA - ambos;
  const jA = baseA * P.pct_joao_A - P.so_joao + P.pago_joao, dA = baseA * P.pct_doug_A - P.so_doug + P.pago_doug, jB = lopB * P.pct_joao_B, dB = lopB * P.pct_doug_B;
  const j = jA + jB, dg = dA + dB, fu = P.fundo_pct, vt = s.vA + s.vB;
  const mixLiq = vt > 0 ? (s.vA * (P.mc_A + s.mc - P.ads_pct_A) + s.vB * (P.mc_B + s.mc - s.adsB)) / vt - impPctX : 0;
  return { fat: fatA + fatB, mcBruto: fatA * (P.mc_A + s.mc) + fatB * (P.mc_B + s.mc), ads: fatA * P.ads_pct_A + fatB * s.adsB, imposto, fixos: P.fixos_ambos, total: j + dg, joao: j, douglas: dg, fundo: (j + dg) * fu,
    joaoLiq: j * (1 - fu), dougLiq: dg * (1 - fu), eqDia: mixLiq > 0 ? P.fixos_ambos / (dias * mixLiq) : Infinity, mixLiq };
}
const simPadraoMes = P => ({ vA: P.vendas_dia_A, vB: P.vendas_dia_B, adsB: P.ads_pct_B, mc: 0, f3: false });
const refBase = D => D.referencia ? (D.sem_opex && D.referencia.lucro_antes_opex != null ? D.referencia.lucro_antes_opex : D.referencia.lucro_total) : null;
function statusMes(D, lucro) {
  const rb = refBase(D);
  if (D.estado === 'fechado') return { cls: 'info', txt: 'Mês fechado, igual à planilha de fechamento' };
  if (lucro < 0) return { cls: 'crit', txt: 'Projeção de prejuízo' };
  if (rb && lucro >= 1.1 * rb) return { cls: 'good', txt: 'Acima de setembro' };
  if (rb && lucro >= 0.9 * rb) return { cls: 'good', txt: 'No nível de setembro' };
  if (rb && lucro >= 0.5 * rb) return { cls: 'warn', txt: 'Abaixo de setembro' };
  if (rb) return { cls: 'crit', txt: 'Bem abaixo de setembro' };
  return { cls: 'good', txt: 'Projeção positiva' };
}
const nomeCurto = n => { const s = String(n).split(' (')[0]; return s.length > 24 ? s.slice(0, 22) + '…' : s; };

function chProjecao(t, o) {
  const cats = Array.from({ length: o.dias }, (_, i) => String(i + 1)), ult = o.real.length - 1, acum = o.real[ult];

    return { type: 'line', name: c.nome, data: d, connectNulls: true, showSymbol: false, silent: true, z: 3, lineStyle: { width: i === 0 ? 2.5 : 1.5, type: 'dashed', color: i === 0 ? t.accent : t.c4 }, itemStyle: { color: i === 0 ? t.accent : t.c4 },

    tooltip: tooltipBase(t, ps => {

  };
}

      <div class="ai-box" id="ai-box" ${window.__sample ? '' : 'hidden'}><div class="ai-row"><button type="button" class="btn-p" id="ai-btn">Pedir sugestões novas ao Claude</button><button type="button" class="btn-i" id="ai-stop" hidden>Parar</button><span class="meta" id="ai-status">${esc(MES.aiStatus || 'Usa os números do painel e o cenário do simulador. Gasta um pouco do seu uso do Claude.')}</span></div><div class="sug" id="ai-out">${MES.aiHtml}</div></div>` })}</div>

    $s('sim-lucro').textContent = brl(r.total); $s('sim-lucro').className = r.total < 0 ? 'neg' : '';
    $s('sim-j').textContent = brl(r.joaoLiq); $s('sim-d').textContent = brl(r.dougLiq);

    $s('sim-eq').textContent = D.sem_opex ? `Sem despesas operacionais na conta, o lucro é a margem depois de Ads e imposto. João e Douglas já descontam o fundo de caixa de ${pct(P.fundo_pct, 0)}; ${div}.`
      : isFinite(r.eqDia) ? `Neste cenário o equilíbrio é ${brlMil(r.eqDia)} de receita bruta por dia. João e Douglas já descontam o fundo de caixa de ${pct(P.fundo_pct, 0)}; ${div}.` : 'Neste cenário a margem não cobre Ads e imposto: nenhum volume dá lucro.';
  };
  const lerControles = () => { MES.sim = { vB: +$s('s-vb').value, vA: $s('s-va') ? +$s('s-va').value : P.vendas_dia_A, adsB: +$s('s-ads').value / 100, mc: +$s('s-mc').value / 100, f3: $s('s-f3').checked }; renderSim(); };
  ['s-vb', 's-va', 's-ads', 's-mc'].forEach(id => { if ($s(id)) $s(id).addEventListener('input', lerControles); });
  $s('s-f3').addEventListener('change', lerControles);
  $s('sim-reset').addEventListener('click', () => { MES.sim = simPadraoMes(P); syncControles(); renderSim(); });

        'Responda só com um JSON array de objetos {"titulo": string, "impacto_mes": number (R$ por mês estimado, 0 se não der para estimar), "texto": string (o porquê, 1-2 frases), "acao": string (o que fazer esta semana)}.\n\nDADOS:\n' + JSON.stringify(dados);
      MES.ctl = new AbortController(); btn.disabled = true; $s('ai-stop').hidden = false; $s('ai-status').textContent = 'Pensando… (pode levar até um minuto)'; $s('ai-out').innerHTML = '';
      try {
        const lista = await window.__sample.json(prompt, { signal: MES.ctl.signal, cache: false });
        const itens = Array.isArray(lista) ? lista.filter(x => x && x.titulo) : [];
        MES.aiHtml = itens.map(x => cartaoSug({ titulo: String(x.titulo), impacto_mes: Number(x.impacto_mes) || 0, texto: String(x.texto || ''), acao: String(x.acao || ''), status: 'nova' })).join('');
        MES.aiStatus = itens.length ? 'Sugestões geradas agora. Confira os números antes de agir e me conte no chat o que decidir.' : 'Não vieram sugestões. Tente de novo.';
      } catch (e) {
        if (e && e.code === 'cancelled') MES.aiStatus = 'Parado.';
        else if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) { MES.aiStatus = COPY[e.code] || 'Indisponível nesta visualização.'; btn.hidden = true; }
        else MES.aiStatus = (e && COPY[e.code]) || 'Não deu certo agora. Tente de novo em instantes.';
      } finally {
        if ($s('ai-out')) { $s('ai-out').innerHTML = MES.aiHtml; $s('ai-status').textContent = MES.aiStatus; btn.disabled = false; $s('ai-stop').hidden = true; }
        MES.ctl = null;
      }
    });
    $s('ai-stop').addEventListener('click', () => MES.ctl && MES.ctl.abort());

};

/* =================================================================================================== DADOS E ALERTAS */
const dhm = s => (s && s.length >= 16) ? `${s.slice(8, 10)}/${s.slice(5, 7)} ${s.slice(11, 16)}` : (s || '–');       // 'AAAA-MM-DD HH:MM' -> 'DD/MM HH:MM'
const dmParaIso = (s, ano) => (s && /^\d\d\/\d\d/.test(s)) ? `${ano}-${s.slice(3, 5)}-${s.slice(0, 2)}` : null;
function statusData(ate, tol = 0) {
  if (!ate) return ['mute', 'Sem dados'];
  const atraso = diffD(ate, hojeStr()) - 1 - tol;                                  // tol: dias de tolerância (devoluções chegam 7 a 15 dias depois da compra)
  if (atraso <= 0) return ['good', 'Em dia'];
  return [atraso >= 3 ? 'crit' : 'warn', `Atrasado ${atraso} dia${atraso > 1 ? 's' : ''}`];
}

      ${cartao({ id: 'com', titulo: 'Como alimentar o painel', sub: 'O que enviar para atualizar', cls: 's5', corpo: comoEnviar })}</div>
    ${secao('Marcos nos gráficos')}
    <div class="grade">${cartao({ id: 'eve', titulo: 'Eventos marcados nos gráficos', sub: 'Aparecem como linhas verticais. Peça ao Claude para incluir campanhas, mudanças de preço ou de custo.', cls: 's12', corpo: ev.length ? `<div class="tw">${tabelaHtml([{ t: 'Dia' }, { t: 'Evento' }], ev.map(e => [dd(e.d) + '/' + e.d.slice(0, 4), esc(e.t)]))}</div>` : vazioHtml('Nenhum evento', '') })}</div>`;
  ligaLinhas($('#cc-qcu'), k => gavetaSku(k, p));
  ligaLinhas($('#cc-qem'), k => gavetaSku(k, p));
};

/* =================================================================================================== partida: banco do artefato, tema e redimensionamento */
(function () {
  ligaFiltros();
  try { new ResizeObserver(() => requestAnimationFrame(() => CH.forEach(c => { try { c.inst.resize(); } catch (e) { /* gráfico já descartado */ } }))).observe($('#main')); } catch (e) { /* sem ResizeObserver */ }
  const claro = () => document.documentElement.getAttribute('data-theme') === 'light';
  const syncTema = () => { const b = $('#t-tema'); if (b) { b.innerHTML = (claro() ? ICON.sun : ICON.moon) + (claro() ? 'Tema claro' : 'Tema escuro'); b.title = claro() ? 'Mudar para o tema escuro' : 'Mudar para o tema claro'; } };
  syncTema();
  /* foto do Douglas (brincadeira): clique para ampliar, clique ou Esc para fechar */
  document.addEventListener('click', e => {
    const im = e.target && e.target.closest ? e.target.closest('.avatar-d') : null;
    if (!im) return;
    let m = $('#foto-modal');
    if (!m) {
      m = document.createElement('div'); m.id = 'foto-modal'; m.className = 'foto-modal'; m.hidden = true;
      m.innerHTML = '<figure><img alt="Douglas"><figcaption>Douglas</figcaption></figure>';
      m.addEventListener('click', () => { m.hidden = true; });
      document.addEventListener('keydown', ev => { if (ev.key === 'Escape') m.hidden = true; });
      document.body.appendChild(m);
    }
    m.querySelector('img').src = im.src; m.hidden = false;
  });
  $('#t-tema').addEventListener('click', () => {
    const novo = claro() ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', novo);
    try { localStorage.setItem('med.tema', novo === 'light' ? 'claro' : 'escuro'); } catch (e) { /* sem armazenamento: vale só nesta visita */ }
  });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', agenda); } catch (e) { /* ignora */ }
  const desejado = () => { try { return localStorage.getItem('med.tema') === 'claro' ? 'light' : 'dark'; } catch (e) { return 'dark'; } };
  const t0 = Date.now();
  try {
    new MutationObserver(() => {
      // o visualizador pode aplicar o tema dele logo depois do carregamento: nos primeiros segundos vale o padrão escuro (ou a escolha guardada); depois, qualquer troca é aceita
      if (Date.now() - t0 < 2500 && document.documentElement.getAttribute('data-theme') !== desejado()) { document.documentElement.setAttribute('data-theme', desejado()); return; }
      syncTema(); agenda();
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (e) { /* ignora */ }
  function semBanco(msg) {
    $('#t-h1').textContent = 'Painel indisponível';
    $('#page').innerHTML = vazioHtml('Não consegui abrir o banco de dados do painel', msg || 'Entre na sua conta do Claude e abra o painel de novo.');
  }
  async function inicia() {
    if (!window.claude || typeof window.claude.use !== 'function') { semBanco('Este painel lê os números do banco do artefato, que só existe dentro do Claude.'); return; }
    let db = null;
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) { semBanco(); return; }
    try { window.__sample = await window.claude.use('sample'); } catch (e) { window.__sample = null; }
    const COLS = ['dias', 'anuncios', 'fin', 'meses', 'cfg', 'loja'], chegou = new Set();
    let liberado = false;                                       // 1º desenho só com todos os dados (a animação não reinicia no meio)
    const libera = () => { if (!liberado) { liberado = true; agenda(); } };
    setTimeout(libera, 2500);
    for (const col of COLS) {
      db.collection(col).onSnapshot(snap => {
        const o = {};
        snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
        DB[col] = o; rebuild(); chegou.add(col);
        if (liberado) agenda(); else if (chegou.size === COLS.length) libera();
      }, () => { chegou.add(col); if (!liberado && chegou.size === COLS.length) libera(); });
    }
    setTimeout(() => { if (!M.carregou) $('#page').innerHTML = vazioHtml('Ainda não há dados no painel', 'Envie as exportações da Shopee e do Mercado Livre no chat e eu carrego aqui.'); }, 6000);
  }
  inicia();
})();

</script>
